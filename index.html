<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMIDE FORGE LAB · ห้องปฏิบัติการพันธะเอไมด์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1018; --panel:#131E2C; --panel2:#1A283A; --line:#28394F;
  --txt:#E8F0FA; --mut:#8FA3BC;
  --ember:#FF8A3D; --ember2:#FFC24A; --aqua:#35D6C7; --violet:#9B8CFF;
  --O:#FF6B6B; --N:#6BA8FF; --Na:#FFD166;
  --ok:#3DDC97; --bad:#FF5C7A;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--txt);
  font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.55}
body{
  background:
    radial-gradient(900px 420px at 100% -8%, rgba(255,138,61,.10), transparent 60%),
    radial-gradient(760px 400px at -10% 12%, rgba(53,214,199,.08), transparent 62%),
    var(--ink);
  min-height:100vh;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
h1,h2,h3,.bname,.mtitle,.tt,.bs1,.vbig{font-family:'Chakra Petch',sans-serif;letter-spacing:.2px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit;font-size:16px}
small{font-size:.82em}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;
  background:linear-gradient(180deg,rgba(10,16,24,.96),rgba(10,16,24,.82));
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;
  background:linear-gradient(140deg,var(--ember),#C24E12);color:#150A03;font-size:20px;font-weight:700;
  box-shadow:0 4px 14px rgba(255,138,61,.35)}
.bname{font-size:15px;font-weight:700;line-height:1.1}
.bsub{font-size:10.5px;color:var(--mut);line-height:1.2}
.topright{display:flex;align-items:center;gap:8px}
.scorepill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-family:'Chakra Petch';font-weight:700;font-size:14px;color:var(--ember2)}
.scorepill small{color:var(--mut);font-weight:500}
.syncdot{width:9px;height:9px;border-radius:50%;background:#4A5B72}
.syncdot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.syncdot.off{background:var(--bad)}
.iconbtn{width:32px;height:32px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--mut);font-size:15px}
.progbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:rgba(255,255,255,.06)}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--ember2));
  transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* ---------- nav ---------- */
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:2px;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,16,24,.75),rgba(10,16,24,.99));
  backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.navb{flex:1;max-width:112px;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 2px;border-radius:12px;font-size:10.5px;color:var(--mut);transition:.18s}
.navb span{font-size:17px;line-height:1}
.navb.on{color:var(--txt);background:var(--panel2)}
.navb.on span{filter:drop-shadow(0 0 8px rgba(255,138,61,.6))}

/* ---------- login ---------- */
.login{padding:calc(env(safe-area-inset-top) + 26px) 20px 40px;max-width:560px;margin:0 auto}
.loginhero{text-align:center;margin-bottom:26px}
.heroring{position:relative;width:150px;height:150px;margin:0 auto 14px}
.heroring:before,.heroring:after{content:'';position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(255,138,61,.25);animation:spin 18s linear infinite}
.heroring:after{inset:16px;border-color:rgba(53,214,199,.22);animation-duration:12s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.heroatom{position:absolute;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-family:'Chakra Petch';font-weight:700;font-size:17px;left:50%;top:50%;margin:-21px 0 0 -21px;
  animation:orb 6s ease-in-out infinite}
.heroatom.o{background:rgba(255,107,107,.16);color:var(--O);border:1px solid rgba(255,107,107,.5);
  transform:translate(-46px,-24px)}
.heroatom.c{background:rgba(255,194,74,.14);color:var(--ember2);border:1px solid rgba(255,194,74,.5);
  transform:translate(0,10px);animation-delay:.5s}
.heroatom.n{background:rgba(107,168,255,.16);color:var(--N);border:1px solid rgba(107,168,255,.5);
  transform:translate(46px,-24px);animation-delay:1s}
@keyframes orb{0%,100%{margin-top:-21px}50%{margin-top:-29px}}
.loginhero h1{font-size:34px;margin:0;letter-spacing:2px;font-weight:700}
.loginhero h1 span{color:var(--ember);display:block;font-size:34px;margin-top:-8px}
.tag{margin:8px 0 4px;font-size:14.5px}
.sub{margin:0;color:var(--mut);font-size:12.5px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.form label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px}
.form label:first-child{margin-top:0}
.form input{width:100%;padding:12px 13px;border-radius:11px;background:var(--panel2);
  border:1px solid var(--line);color:var(--txt);outline:none;transition:.18s}
.form input:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,138,61,.14)}
.form .btn{margin-top:16px;width:100%}

/* ---------- buttons ---------- */
.btn{padding:13px 16px;border-radius:13px;font-weight:600;font-size:14.5px;
  background:var(--panel2);border:1px solid var(--line);transition:.16s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(140deg,var(--ember),#D95F17);color:#160A02;border-color:transparent;
  box-shadow:0 6px 18px rgba(255,138,61,.28)}
.btn.aqua{background:linear-gradient(140deg,var(--aqua),#159C90);color:#03201D;border-color:transparent;
  box-shadow:0 6px 18px rgba(53,214,199,.24)}
.btn.ghost{color:var(--mut)}
.btn.big{padding:15px;font-size:16px}
.btn:disabled{opacity:.42;box-shadow:none}
.dock{display:flex;gap:10px;margin-top:16px}
.dock .btn{flex:1}

/* ---------- home ---------- */
.hello{font-size:14px;color:var(--mut);margin:2px 0 14px}
.tile{display:flex;gap:13px;width:100%;text-align:left;padding:16px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);margin-bottom:12px;position:relative;overflow:hidden}
.tile:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.tile.synth:before{background:linear-gradient(180deg,var(--ember),var(--ember2))}
.tile.hydro:before{background:linear-gradient(180deg,var(--aqua),var(--N))}
.tile:active{transform:scale(.99)}
.tico{font-size:26px;flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:var(--panel2)}
.tt{font-size:17px;font-weight:700}
.td{font-size:12.6px;color:var(--mut);margin-top:3px}
.tprog{font-size:11.5px;margin-top:8px;color:var(--ember2);font-weight:600}
.tile.hydro .tprog{color:var(--aqua)}
.tilerow{display:flex;gap:12px}
.tile2{flex:1;padding:15px 12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:13.5px}
.tile2 span{font-size:23px}
.tile2 small{color:var(--mut);font-weight:400;font-size:11px}
.howto{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.hh{font-weight:700;margin-bottom:6px;font-size:14px}
.howto ul{margin:0;padding-left:18px;color:var(--mut);font-size:12.6px}
.howto li{margin:3px 0}

/* ---------- mission list ---------- */
.mlisthead{padding:16px;border-radius:var(--r);margin-bottom:14px;border:1px solid var(--line);
  background:var(--panel)}
.mlisthead.synth{background:linear-gradient(140deg,rgba(255,138,61,.16),var(--panel))}
.mlisthead.hydro{background:linear-gradient(140deg,rgba(53,214,199,.14),var(--panel))}
.mlisthead h2{margin:0 0 4px;font-size:19px}
.mlisthead p{margin:0;font-size:12.4px;color:var(--mut)}
.mcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;
  border-radius:14px;background:var(--panel);border:1px solid var(--line);margin-bottom:9px}
.mcard:active{transform:scale(.99)}
.mnum{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-family:'Chakra Petch';font-weight:700;font-size:13px;background:var(--panel2);color:var(--mut)}
.mcard.synth .mnum{color:var(--ember2)}
.mcard.hydro .mnum{color:var(--aqua)}
.mcard.done{border-color:rgba(61,220,151,.45)}
.mbody{flex:1;min-width:0}
.mt{font-weight:600;font-size:14.5px}
.mdsc{font-size:11.8px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.star{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-family:'Chakra Petch';font-weight:700;font-size:14px;background:rgba(61,220,151,.15);color:var(--ok);
  border:1px solid rgba(61,220,151,.4)}
.star.off{background:var(--panel2);color:#54677E;border-color:var(--line)}

/* ---------- lab / mission head ---------- */
.mhead{padding:14px 15px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);
  margin-bottom:13px;border-left:4px solid var(--ember)}
.mhead.hyd{border-left-color:var(--aqua)}
.mhead.free{border-left-color:var(--violet)}
.mtitle{font-size:16.5px;font-weight:700}
.mid{font-family:'Chakra Petch';font-size:11.5px;background:var(--panel2);padding:2px 7px;border-radius:6px;
  color:var(--ember2);vertical-align:middle}
.mhead.hyd .mid{color:var(--aqua)}
.mbrief{font-size:13px;color:var(--mut);margin-top:5px}
.mbrief b{color:var(--txt)}

/* ---------- bench (พื้นที่โมเลกุล) ---------- */
.bench{position:relative;background:
    linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:20px 12px 16px;margin-bottom:12px;
  overflow-x:auto;text-align:center}
.bench.empty{color:var(--mut);font-size:13px;padding:34px 16px}
.bench.hot{box-shadow:inset 0 -40px 60px -40px rgba(255,138,61,.55);border-color:rgba(255,138,61,.4)}
.bench.cut{box-shadow:inset 0 -40px 60px -40px rgba(53,214,199,.45);border-color:rgba(53,214,199,.35)}
.bench.small{padding:8px}
.benchlab{position:absolute;top:8px;left:12px;font-size:10.5px;color:var(--mut);
  background:var(--panel2);padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.benchlab.hotlab{color:var(--ember2);border-color:rgba(255,138,61,.45)}
.bench.frag{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fragbox{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.molrow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.rowmol{flex:0 1 auto}
.rowsym{font-size:19px;color:var(--mut);padding:0 2px;font-family:'Chakra Petch'}
.rxn{display:inline-flex;flex-direction:column;align-items:center;color:var(--ember2);font-size:22px;line-height:.9}
.rxn small{font-size:9.5px;color:var(--mut)}
.molcap{font-size:11.5px;color:var(--mut);margin-top:4px}
.molcap b{color:var(--txt)}

/* ---------- SVG โมเลกุล ---------- */
svg.mol{width:100%;height:auto;max-height:220px;display:block;margin:0 auto;overflow:visible}
.bond{stroke:#9FB0C6;stroke-width:2.2;stroke-linecap:round}
.bond.target{stroke:var(--ember);stroke-width:3}
.bond.target2{stroke:var(--aqua);stroke-width:3}
.bond.dash{stroke:#5C7290}
.bondhit{stroke:transparent;stroke-width:26;cursor:pointer}
.nodehit{fill:transparent;cursor:pointer}
.nodebg{fill:var(--panel);stroke:transparent}
text.atom{font-family:'Chakra Petch',sans-serif;font-size:19px;font-weight:600;
  text-anchor:middle;dominant-baseline:middle}
.ring{fill:none;stroke:#C7D4E6;stroke-width:2.2;stroke-linejoin:round}
.ringin{fill:none;stroke:#8CA0BA;stroke-width:1.8}
.chg{fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.35);stroke-width:1}
.chgt{font-family:'Chakra Petch';font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:middle}
.node.target .nodebg{fill:rgba(255,138,61,.2);stroke:var(--ember);stroke-width:2;
  animation:pulseA 1.25s ease-in-out infinite}
.node.target2 .nodebg{fill:rgba(53,214,199,.2);stroke:var(--aqua);stroke-width:2;
  animation:pulseA 1.25s ease-in-out infinite}
@keyframes pulseA{0%,100%{opacity:.55}50%{opacity:1}}
.node.slot .nodebg{fill:rgba(155,140,255,.14);stroke:var(--violet);stroke-width:2;stroke-dasharray:5 4;
  animation:pulseA 1.1s ease-in-out infinite}
.gone{animation:goneA .85s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes goneA{0%{opacity:1}100%{opacity:0;transform:translate(0,-26px) scale(.7)}}
.newbond{animation:popA .5s ease-out backwards;transform-box:fill-box;transform-origin:center}
svg.appear{animation:popA .45s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes popA{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}

/* ---------- shelf / chips ---------- */
.shelf{margin-bottom:10px}
.shelflab{font-size:11.5px;color:var(--ember2);margin:0 0 6px 2px}
.shelflab.amine{color:var(--N)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:118px;padding:9px 11px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);text-align:left;transition:.16s}
.chip.sel{border-color:var(--ember);background:rgba(255,138,61,.13);box-shadow:0 0 0 2px rgba(255,138,61,.16)}
.chip.amine.sel{border-color:var(--N);background:rgba(107,168,255,.13);box-shadow:0 0 0 2px rgba(107,168,255,.16)}
.chipname{display:block;font-size:12.5px;font-weight:600}
.chipf{display:block;font-family:'Chakra Petch';font-size:11.5px;color:var(--mut);margin-top:1px}
.fact{font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--ember);border-radius:11px;padding:8px 11px;margin-bottom:8px}
.fact.amine{border-left-color:var(--N)}

/* ---------- burner (ชิ้นเอกของเกม) ---------- */
.burner{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin-bottom:12px;transition:.3s}
.burner.hot{border-color:rgba(255,138,61,.55);box-shadow:0 0 30px -8px rgba(255,138,61,.5)}
.flamewrap{position:relative;width:52px;height:66px;flex:none;display:grid;place-items:end center}
.flamewrap:after{content:'';position:absolute;bottom:0;width:36px;height:8px;border-radius:3px;
  background:linear-gradient(180deg,#42556E,#26364B)}
.flame{position:absolute;bottom:6px;width:calc(14px + 12px * var(--i));
  height:calc(8px + 46px * var(--i));border-radius:50% 50% 46% 46%/62% 62% 38% 38%;
  background:linear-gradient(180deg,#FFE9A8,var(--ember2) 42%,var(--ember) 76%,#D93E0F);
  filter:blur(.4px);opacity:calc(.25 + .75 * var(--i));
  animation:flick .42s ease-in-out infinite alternate;
  box-shadow:0 0 calc(10px + 30px * var(--i)) rgba(255,138,61,calc(.25 + .5 * var(--i)))}
.flame.f2{width:calc(7px + 6px * var(--i));height:calc(5px + 24px * var(--i));
  background:linear-gradient(180deg,#DCF3FF,#7EC8FF 60%,transparent);animation-duration:.3s;opacity:calc(.4*var(--i))}
@keyframes flick{from{transform:scaleY(.93) translateX(-1px)}to{transform:scaleY(1.06) translateX(1px)}}
.tempbox{flex:1}
.tempv{font-family:'Chakra Petch';font-size:22px;font-weight:700;color:var(--ember2)}
.tempbox input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:99px;margin:8px 0 4px;
  background:linear-gradient(90deg,#2B5C8A 0%,#2B5C8A 48%,var(--ember) 48%,var(--ember2) 100%);outline:none}
.tempbox input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;border:3px solid var(--ember);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tempbox input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;
  border:3px solid var(--ember)}
.templab{display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}
.templab .mark{color:var(--ember2);font-weight:600}

/* ---------- notes ---------- */
.note{font-size:12.6px;color:var(--mut);background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:11px 13px;margin-bottom:11px}
.note b{color:var(--txt)}
.note.warn{border-left:3px solid var(--ember2)}
.note.act{border-left:3px solid var(--violet);color:var(--txt)}
.note.think{border-left:3px solid var(--ok);background:rgba(61,220,151,.07)}

/* ---------- tray ---------- */
.tray{background:var(--panel);border:1px dashed var(--line);border-radius:13px;padding:10px 12px;margin-bottom:11px;
  transition:.25s}
.tray.has{border-color:var(--aqua)}
.traylab{font-size:10.5px;color:var(--mut);margin-bottom:6px}
.traybody{display:flex;align-items:center;gap:8px;font-family:'Chakra Petch';font-size:16px;flex-wrap:wrap}
.piece{padding:5px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.piece.o{color:var(--O);border-color:rgba(255,107,107,.5)}
.piece.h{color:var(--txt)}
.piece.w{color:var(--aqua);border-color:var(--aqua);background:rgba(53,214,199,.12);
  animation:popA .5s cubic-bezier(.2,.9,.3,1.4)}
.piece.ghost{color:#4E617A;border-style:dashed}
.plus,.arrow{color:var(--mut)}

/* ---------- ผลลัพธ์ ---------- */
.eqbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;
  margin-bottom:12px;overflow-x:auto}
.eqbox svg.mol{max-height:150px}
.prodcard{background:linear-gradient(140deg,rgba(255,138,61,.14),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:15px;margin-bottom:12px}
.pname{font-family:'Chakra Petch';font-size:19px;font-weight:700;color:var(--ember2)}
.pmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:5px}
.pmeta b{color:var(--txt);font-family:'Chakra Petch'}
.pnote{font-size:11.8px;color:var(--mut);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.verdict{border-radius:var(--r);padding:15px;margin-bottom:12px;font-size:13px}
.verdict.ok{background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.45)}
.verdict.no{background:rgba(255,92,122,.10);border:1px solid rgba(255,92,122,.4)}
.vbig{font-size:18px;font-weight:700;margin-bottom:3px}
.verdict.ok .vbig{color:var(--ok)}
.verdict.no .vbig{color:var(--bad)}
.vscore{margin-top:8px;font-family:'Chakra Petch';font-size:17px;font-weight:700;color:var(--ember2)}

/* ---------- polymer ---------- */
.polybox{background:linear-gradient(140deg,rgba(155,140,255,.14),var(--panel));border:1px solid rgba(155,140,255,.4);
  border-radius:var(--r);padding:14px;margin-bottom:12px}
.polylab{font-size:12px;color:var(--violet);margin-bottom:8px;font-weight:600}
.polychain{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-family:'Chakra Petch';font-size:12.5px}
.unit{padding:5px 8px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  animation:popA .5s backwards}
.unit.hi{color:var(--N);border-color:rgba(107,168,255,.5)}
.unit.hi2{color:var(--ember2);border-color:rgba(255,194,74,.5)}
.link{color:var(--mut)}
.polyfoot{font-size:11.5px;color:var(--mut);margin-top:9px}

/* ---------- condition ---------- */
.condgrid{display:flex;gap:9px;margin-bottom:12px}
.condbtn{flex:1;padding:14px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13.5px;font-weight:600;transition:.16s}
.condbtn small{font-size:10.5px;color:var(--mut);font-weight:400}
.condbtn .cico{font-size:24px}

.condbtn.acid{border-color:rgba(255,138,61,.45)}
.condbtn.base{border-color:rgba(53,214,199,.45)}
.pieces{display:flex;gap:10px;margin-bottom:11px}
.piecebtn{flex:1;padding:13px;border-radius:13px;background:var(--panel);border:2px solid var(--line);
  font-family:'Chakra Petch';font-size:17px;font-weight:700;transition:.16s}
.piecebtn.o{color:var(--O)}
.piecebtn.sel{border-color:var(--violet);background:rgba(155,140,255,.15);transform:translateY(-2px)}
.piecebtn.used{opacity:.35}

/* ---------- compare ---------- */
.cmp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:12px}
.cmphead{font-weight:700;font-size:13.5px;margin-bottom:8px}
.cmprow{font-size:12.3px;color:var(--mut);padding:8px;border-radius:10px;margin-bottom:5px;background:var(--panel2)}
.cmprow.now{color:var(--txt);box-shadow:inset 0 0 0 1px var(--ember)}
.cmprow b{color:var(--txt)}
.ctag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;margin-right:6px;font-weight:700}
.ctag.a{background:rgba(255,138,61,.2);color:var(--ember2)}
.ctag.b{background:rgba(53,214,199,.2);color:var(--aqua)}

/* ---------- score page ---------- */
.bigscore{text-align:center;background:linear-gradient(150deg,rgba(255,138,61,.16),var(--panel));
  border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:14px}
.bs1{font-family:'Chakra Petch';font-size:56px;font-weight:700;line-height:1;color:var(--ember2)}
.bs2{font-size:13px;color:var(--mut);margin-top:4px}
.bs3{font-size:12px;color:var(--mut)}
.stab{width:100%;border-collapse:collapse;font-size:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stab th{background:var(--panel2);padding:9px 6px;font-size:11px;color:var(--mut);font-weight:600}
.stab td{padding:9px 6px;border-top:1px solid var(--line);color:var(--mut)}
.stab tr.ok td{color:var(--txt)}
.stab td.num{text-align:center;font-family:'Chakra Petch'}

/* ---------- reference ---------- */
.refcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:12px;border-left:4px solid var(--ember)}
.refcard.aqua{border-left-color:var(--aqua)}
.refcard.warn{border-left-color:var(--bad)}
.reftag{position:absolute;top:12px;right:14px;font-family:'Chakra Petch';font-size:26px;color:rgba(255,255,255,.08);
  font-weight:700}
.refcard h3{margin:0 0 9px;font-size:15px}
.refeq{font-family:'Chakra Petch';font-size:14px;background:var(--panel2);border-radius:10px;padding:10px 12px;
  margin-bottom:9px;overflow-x:auto;white-space:nowrap}
.refeq .ar{color:var(--ember2);display:inline-flex;flex-direction:column;align-items:center;line-height:.9;
  vertical-align:middle;margin:0 4px}
.refeq .ar small{font-size:9px;color:var(--mut)}
.refcard ul{margin:0;padding-left:18px;font-size:12.4px;color:var(--mut)}
.refcard li{margin:4px 0}
.refcard b{color:var(--txt)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  max-width:480px;width:calc(100% - 28px);background:#1E2B3D;border:1px solid var(--line);
  border-radius:14px;padding:12px 15px;font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.8,.2,1);z-index:60;line-height:1.5}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,92,122,.55);background:#2A1A24}
.toast b{color:var(--ember2)}
.toast.bad b{color:var(--bad)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---------- WP-03: ป้ายส่วนขยาย / ระดับการคิด / ห้องไอโซเมอร์ ---------- */
.xtag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.2px;padding:1px 7px;border-radius:999px;

.isocount b{font-family:'Chakra Petch';font-size:24px;color:var(--aqua)}
.ledger{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ledger th{font-size:11px;color:var(--mut);font-weight:600;text-align:left;padding:7px 10px;background:var(--panel2)}
.ledger td{padding:7px 10px;border-top:1px solid var(--line)}

.rdots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}

.condbtn.ran{border-color:var(--ok);box-shadow:inset 0 0 0 1px rgba(61,220,151,.4)}
.qres{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--aqua);border-radius:12px;
  padding:11px 12px;margin-bottom:9px;font-size:12.6px;color:var(--mut)}
.qres b{color:var(--txt)}
.qcmp{margin-top:6px}
.okc{color:var(--ok);font-weight:700}
.noc{color:var(--bad);font-weight:700}
.vnote{margin-top:6px;font-size:12.3px;color:var(--mut)}
</style>

<div id="app"></div>
<script>
/* ===== 00_data.js ===== */
/* ==========================================================
   AMIDE FORGE LAB — 00_data.js
   ข้อมูลสารตั้งต้น ระบบเรียกชื่อ และภารกิจ
   ========================================================== */

var APP_VERSION = 'v1.1.2';

/* ---------- กรดคาร์บอกซิลิก ----------
   R      : ชนิดของหมู่ R (label หรือ ring)
   acyl   : รากชื่อสำหรับเอไมด์ (acyl + 'ไมด์')
   at     : จำนวนอะตอม {C,H,O,N}
*/
var ACIDS = [
  { id:'HCOOH',  R:{t:'label', s:'H'},        name:'กรดเมทาโนอิก',    sub:'(กรดฟอร์มิก)',
    formula:'HCOOH', acyl:'เมทานา', at:{C:1,H:2,O:2,N:0},
    fact:'พบในเหล็กในของมดและผึ้ง' },
  { id:'CH3COOH', R:{t:'label', s:'CH₃'},      name:'กรดเอทาโนอิก',    sub:'(กรดแอซีติก)',
    formula:'CH₃COOH', acyl:'เอทานา', at:{C:2,H:4,O:2,N:0},
    fact:'กรดในน้ำส้มสายชู' },
  { id:'C2H5COOH',R:{t:'label', s:'CH₃CH₂'},   name:'กรดโพรพาโนอิก',  sub:'(กรดโพรพิโอนิก)',
    formula:'CH₃CH₂COOH', acyl:'โพรพานา', at:{C:3,H:6,O:2,N:0},
    fact:'ใช้เป็นสารกันเชื้อราในขนมปัง' },
  { id:'C3H7COOH',R:{t:'label', s:'CH₃CH₂CH₂'},name:'กรดบิวทาโนอิก',  sub:'(กรดบิวทิริก)',
    formula:'CH₃CH₂CH₂COOH', acyl:'บิวทานา', at:{C:4,H:8,O:2,N:0},
    fact:'กลิ่นเนยหืน' },
  { id:'C6H5COOH',R:{t:'ring'},                name:'กรดเบนโซอิก',     sub:'(วงเบนซีน)',
    formula:'C₆H₅COOH', acyl:'เบนซา', at:{C:7,H:6,O:2,N:0},
    fact:'ใช้เป็นวัตถุกันเสียในอาหาร' },
  { id:'ADIPIC',  R:{t:'label', s:'HOOC(CH₂)₄'},name:'กรดเฮกเซนไดโออิก', sub:'(กรดแอดิปิก)',
    formula:'HOOC(CH₂)₄COOH', acyl:'เฮกเซนได', at:{C:6,H:10,O:4,N:0},
    di:true, fact:'มีหมู่ –COOH สองหมู่ ใช้ทำไนลอน 6,6' }
];

/* ---------- แอมโมเนีย / เอมีน ----------
   sub1 : หมู่ที่เขียนทางขวาของ N
   sub2 : หมู่ที่เขียนใต้ N
   pre  : คำนำหน้าชื่อเอไมด์
*/
var AMINES = [
  { id:'NH3',   name:'แอมโมเนีย',        sub:'', formula:'NH₃',
    sub1:{t:'label', s:'H'}, sub2:{t:'label', s:'H'}, pre:'', deg:'—',
    at:{C:0,H:3,O:0,N:1}, fact:'ไนโตรเจนมีอิเล็กตรอนคู่โดดเดี่ยว 1 คู่' },
  { id:'CH3NH2',name:'เมทานามีน',        sub:'(เมทิลเอมีน)', formula:'CH₃NH₂',
    sub1:{t:'label', s:'CH₃'}, sub2:{t:'label', s:'H'}, pre:'N-เมทิล', deg:'1°',
    at:{C:1,H:5,O:0,N:1}, fact:'กลิ่นคาวคล้ายปลาเน่า' },
  { id:'C2H5NH2',name:'เอทานามีน',       sub:'(เอทิลเอมีน)', formula:'CH₃CH₂NH₂',
    sub1:{t:'label', s:'CH₃CH₂'}, sub2:{t:'label', s:'H'}, pre:'N-เอทิล', deg:'1°',
    at:{C:2,H:7,O:0,N:1}, fact:'เอมีนปฐมภูมิ มี H บน N สองอะตอม' },
  { id:'ME2NH', name:'N-เมทิลเมทานามีน', sub:'(ไดเมทิลเอมีน)', formula:'(CH₃)₂NH',
    sub1:{t:'label', s:'CH₃'}, sub2:{t:'label', s:'CH₃'}, pre:'N,N-ไดเมทิล', deg:'2°',
    at:{C:2,H:7,O:0,N:1}, fact:'เอมีนทุติยภูมิ มี H บน N เพียงอะตอมเดียว' },
  { id:'PhNH2', name:'เบนซีนามีน',        sub:'(อะนิลีน)', formula:'C₆H₅NH₂',
    sub1:{t:'ring'}, sub2:{t:'label', s:'H'}, pre:'N-ฟีนิล', deg:'1°',
    at:{C:6,H:7,O:0,N:1}, fact:'ต้นทางของสีย้อมและยาหลายชนิด' },
  { id:'HDA',   name:'เฮกเซน-1,6-ไดอามีน', sub:'(ไดเอมีน)', formula:'H₂N(CH₂)₆NH₂',
    sub1:{t:'label', s:'(CH₂)₆NH₂'}, sub2:{t:'label', s:'H'}, pre:'N-(6-อะมิโนเฮกซิล)', deg:'1°',
    at:{C:6,H:16,O:0,N:2}, di:true, fact:'มีหมู่ –NH₂ สองหมู่ ใช้ทำไนลอน 6,6' }
];

function acidById(id){ for(var i=0;i<ACIDS.length;i++){ if(ACIDS[i].id===id) return ACIDS[i]; } return null; }
function amineById(id){ for(var i=0;i<AMINES.length;i++){ if(AMINES[i].id===id) return AMINES[i]; } return null; }

/* ---------- ชื่อเอไมด์ ---------- */
function amideName(acid, amine){
  if(acid.id==='ADIPIC' || amine.id==='HDA') return 'พันธะเอไมด์ของพอลิเอไมด์ (ไนลอน 6,6)';
  return (amine.pre ? amine.pre : '') + acid.acyl + 'ไมด์';
}

/* ---------- สูตรโมเลกุล ---------- */
function fmtFormula(at){
  var s='';
  if(at.C){ s+='C'+(at.C>1?sub(at.C):''); }
  if(at.H){ s+='H'+(at.H>1?sub(at.H):''); }
  if(at.N){ s+='N'+(at.N>1?sub(at.N):''); }
  if(at.O){ s+='O'+(at.O>1?sub(at.O):''); }
  return s;
}
function sub(n){
  var m={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
  return String(n).split('').map(function(c){return m[c]||c;}).join('');
}
function amideAtoms(acid, amine){
  return { C: acid.at.C+amine.at.C,
           H: acid.at.H+amine.at.H-2,
           O: acid.at.O+amine.at.O-1,
           N: acid.at.N+amine.at.N };
}

/* ==========================================================
   ภารกิจ: ห้องเชื่อมพันธะ (การสังเคราะห์เอไมด์)
   goal = {acid, amine} หรือ target = ชื่อ/สูตรที่ต้องหาเอง
   ========================================================== */
var SYNTH_MISSIONS = [
  { id:'S1', title:'เอไมด์โมเลกุลแรก',
    brief:'สร้าง <b>เอทานาไมด์</b> (CH₃CONH₂) โมเลกุลเอไมด์ที่เล็กที่สุดตัวหนึ่ง',
    want:{acid:'CH3COOH', amine:'NH3'},
    hint:'ชื่อ “เอทานา-” มาจากกรดที่มีคาร์บอน 2 อะตอม และไม่มีคำนำหน้า N- แปลว่าไนโตรเจนยังมี H ครบ',
    reflect:'ผลิตภัณฑ์มี 2 ชนิดเสมอ คือ เอไมด์ และ น้ำ จึงเรียกว่า “ปฏิกิริยาการควบแน่น”' },

  { id:'S2', title:'อ่านชื่อให้ออก',
    brief:'สร้าง <b>N-เมทิลเอทานาไมด์</b>',
    want:{acid:'CH3COOH', amine:'CH3NH2'},
    hint:'คำนำหน้า “N-เมทิล” บอกว่ามีหมู่ CH₃ เกาะอยู่บนไนโตรเจน แปลว่าเอมีนที่ใช้ต้องมี CH₃ ติดกับ N',
    reflect:'ส่วนหน้าชื่อ (N-…) มาจากเอมีน ส่วนหลังชื่อ (…านาไมด์) มาจากกรดคาร์บอกซิลิก' },

  { id:'S3', title:'วงเบนซีนเข้าห้องแล็บ',
    brief:'สร้าง <b>เบนซาไมด์</b>',
    want:{acid:'C6H5COOH', amine:'NH3'},
    hint:'ชื่อ “เบนซา-” มาจากกรดเบนโซอิก และไม่มี N- นำหน้า',
    reflect:'กรดแอโรแมติกก็เกิดเอไมด์ได้เหมือนกรดอะลิฟาติก เพราะมีหมู่ –COOH เหมือนกัน' },

  { id:'S4', title:'เอมีนที่มีวงเบนซีน',
    brief:'สร้าง <b>N-ฟีนิลเอทานาไมด์</b> จากกรดเอทาโนอิกกับเบนซีนามีน',
    want:{acid:'CH3COOH', amine:'PhNH2'},
    hint:'“N-ฟีนิล” = วงเบนซีนเกาะบน N จึงต้องเลือกเอมีนที่มีวงเบนซีนติดกับ N',
    reflect:'วงเบนซีนที่เกาะบน N ทำให้ได้คำนำหน้า N-ฟีนิล ส่วนฝั่งกรดยังเรียกว่า เอทานา- เหมือนเดิม',
    extNote:'ยาพาราเซตามอลมีเอไมด์ชนิดนี้เป็นโครงสร้างแกน โดยมีหมู่ –OH เพิ่มบนวงเบนซีน (ชื่อ IUPAC: N-(4-ไฮดรอกซีฟีนิล)เอทานาไมด์) · ยาเป็นเรื่องนอกกรอบบทเรียนนี้' },

  { id:'S5', title:'ไนโตรเจนไม่มี H เหลือ',
    brief:'สร้าง <b>N,N-ไดเมทิลเมทานาไมด์</b> (DMF ตัวทำละลายยอดนิยม)',
    want:{acid:'HCOOH', amine:'ME2NH'},
    hint:'“N,N-ไดเมทิล” = มี CH₃ สองหมู่บน N จึงต้องใช้เอมีนทุติยภูมิ ส่วน “เมทานา-” มาจากกรดที่มี C 1 อะตอม',
    reflect:'เอมีนทุติยภูมิมี H บน N เพียง 1 อะตอม จึงยังเกิดเอไมด์ได้ แต่เอมีนตติยภูมิไม่มี H เลย จึงเกิดไม่ได้' },

  { id:'S6', title:'ไอโซเมอร์คู่ปริศนา ①',
    brief:'สร้างเอไมด์ที่มีสูตรโมเลกุล <b>C₈H₉NO</b> โดยใช้ <b>กรดเบนโซอิก</b> เป็นสารตั้งต้น',
    want:{acid:'C6H5COOH', amine:'CH3NH2'},
    hint:'นับอะตอม: กรดเบนโซอิกให้ C 7 อะตอม จึงเหลือ C อีก 1 อะตอมให้เอมีน',

/* ==========================================================
   AMIDE FORGE LAB — 10_mol.js
   โครงสร้างโมเลกุล: ตัวสร้าง layout + ตัววาด SVG
   ========================================================== */

var DX = 56, DY = 50;
var COL = { O:'#FF6B6B', N:'#6BA8FF', C:'#E7EEF8', H:'#B9C6D8', Na:'#FFD166', dim:'#7C8BA1' };

function newMol(){ return { nodes:[], bonds:[], extras:[] }; }

function addNode(m, id, x, y, text, o){
  o = o || {};
  var n = {
    id:id, x:x, y:y, text:text||'', kind:o.kind||'label',
    color:o.color||COL.C, charge:o.charge||'', hit:o.hit||null,
    cls:o.cls||'', hidden:!!o.hidden, big:!!o.big
  };
  if(n.kind==='ring'){ n.w=52; n.h=52; }
  else { n.w = Math.max(20, textW(n.text)+6); n.h = 24; }
  m.nodes.push(n);
  return n;
}

function textW(t){
  var w=0;
  for(var i=0;i<t.length;i++){
    var c=t[i];
    if('₀₁₂₃₄₅₆₇₈₉'.indexOf(c)>=0) w+=6;
    else if('()'.indexOf(c)>=0) w+=6;
    else w+=11;
  }
  return w;
}

function addBond(m, a, b, o){
  o=o||{};
  m.bonds.push({ a:a, b:b, order:o.order||1, hit:o.hit||null, cls:o.cls||'', color:o.color||'#9FB0C6' });
}

function getNode(m, id){ for(var i=0;i<m.nodes.length;i++){ if(m.nodes[i].id===id) return m.nodes[i]; } return null; }

function shiftMol(m, dx, dy){
  for(var i=0;i<m.nodes.length;i++){ m.nodes[i].x+=dx; m.nodes[i].y+=dy; }
  return m;
}
function mergeMols(){
  var out=newMol();
  for(var i=0;i<arguments.length;i++){
    var m=arguments[i];
    if(!m) continue;
    out.nodes=out.nodes.concat(m.nodes);
    out.bonds=out.bonds.concat(m.bonds);
    out.extras=out.extras.concat(m.extras||[]);
  }
  return out;
}
function prefixMol(m, p){
  var map={};
  for(var i=0;i<m.nodes.length;i++){ var old=m.nodes[i].id; m.nodes[i].id=p+old; map[old]=p+old; }
  for(var j=0;j<m.bonds.length;j++){
    if(map[m.bonds[j].a]) m.bonds[j].a=map[m.bonds[j].a];
    if(map[m.bonds[j].b]) m.bonds[j].b=map[m.bonds[j].b];
  }
  return m;
}

function isH(g){ return g && g.t==='label' && g.s==='H'; }

/* ---------- ตัวช่วยวางหมู่ R ---------- */
function placeGroup(m, id, x, y, g, o){
  o=o||{};
  if(g.t==='ring') return addNode(m, id, x, y, '', {kind:'ring', hit:o.hit, cls:o.cls});
  return addNode(m, id, x, y, g.s, {hit:o.hit, cls:o.cls, color:(g.s==='H'?COL.H:COL.C)});
}

/* ==========================================================
   ตัวสร้างโครงสร้าง
   ========================================================== */

/* กรดคาร์บอกซิลิก  R—C(=O)—O—H */
function molAcid(acid, opt){
  opt=opt||{};
  var m=newMol();
  placeGroup(m,'R',0,0,acid.R,{hit:opt.hits?'R':null});
  addNode(m,'C',DX,0,'C',{hit:opt.hits?'C':null});
  addNode(m,'Ocarb',DX,-DY,'O',{color:COL.O, hit:opt.hits?'Ocarb':null});
  addNode(m,'Ooh',2*DX,0,'O',{color:COL.O, hit:opt.hits?'OH':null, cls:opt.ohCls||''});
  addNode(m,'Hoh',3*DX,0,'H',{color:COL.H, hit:opt.hits?'OH':null, cls:opt.ohCls||''});
  addBond(m,'R','C');
  addBond(m,'C','Ocarb',{order:2});
  addBond(m,'C','Ooh',{cls:opt.ohCls||''});
  addBond(m,'Ooh','Hoh',{cls:opt.ohCls||''});
  return m;
}

/* เอมีน  H—N(sub1)(sub2) */
function molAmine(amine, opt){
  opt=opt||{};
  var m=newMol();
  addNode(m,'Hn',0,0,'H',{color:COL.H, hit:opt.hits?'NH':null, cls:opt.nhCls||''});
  addNode(m,'N',DX,0,'N',{color:COL.N, hit:opt.hits?'N':null});
  var h1 = isH(amine.sub1) ? 'NH' : 'S1';
  var h2 = isH(amine.sub2) ? 'NH' : 'S2';
  placeGroup(m,'S1',2*DX,0,amine.sub1,{hit:opt.hits?h1:null});
  placeGroup(m,'S2',DX,DY,amine.sub2,{hit:opt.hits?h2:null});
  addBond(m,'Hn','N',{cls:opt.nhCls||''});
  addBond(m,'N','S1');
  addBond(m,'N','S2');
  return m;
}

/* เอไมด์  R—C(=O)—N(sub1)(sub2) */
function molAmide(acid, amine, opt){
  opt=opt||{};
  var m=newMol();
  placeGroup(m,'R',0,0,acid.R,{hit:opt.hits?'R':null});
  addNode(m,'C',DX,0,'C',{});
  addNode(m,'Ocarb',DX,-DY,'O',{color:COL.O});
  addNode(m,'N',2*DX,0,'N',{color:COL.N});
  placeGroup(m,'S1',3*DX,0,amine.sub1,{});
  placeGroup(m,'S2',2*DX,DY,amine.sub2,{});
  addBond(m,'R','C',{hit:opt.hits?'b_RC':null});
  addBond(m,'C','Ocarb',{order:2, hit:opt.hits?'b_CO':null});
  addBond(m,'C','N',{hit:opt.hits?'b_CN':null, cls:opt.amideCls||''});
  addBond(m,'N','S1',{hit:opt.hits?'b_NS1':null});
  addBond(m,'N','S2',{hit:opt.hits?'b_NS2':null});
  return m;
}

/* น้ำ  H—O—H */
function molWater(){
  var m=newMol();
  addNode(m,'H1',0,0,'H',{color:COL.H});
  addNode(m,'Ow',DX*0.85,0,'O',{color:COL.O});
  addNode(m,'H2',DX*1.7,0,'H',{color:COL.H});
  addBond(m,'H1','Ow'); addBond(m,'Ow','H2');
  return m;
}

/* คาร์บอกซิเลตไอออน  R—C(=O)—O⁻   (ใส่ Na⁺ ได้) */
function molCarboxylate(acid, withNa){
  var m=newMol();
  placeGroup(m,'R',0,0,acid.R,{});
  addNode(m,'C',DX,0,'C',{});
  addNode(m,'Ocarb',DX,-DY,'O',{color:COL.O});
  addNode(m,'Om',2*DX,0,'O',{color:COL.O, charge:'–'});
  addBond(m,'R','C'); addBond(m,'C','Ocarb',{order:2}); addBond(m,'C','Om');
  if(withNa) addNode(m,'Na',3*DX,0,'Na',{color:COL.Na, charge:'+'});
  return m;
}

/* กรดคาร์บอกซิลิก (ผลิตภัณฑ์) เหมือน molAcid แต่ไม่มี hit */
function molAcidPlain(acid){ return molAcid(acid,{}); }

/* แอมโมเนียม  H—N⁺(H)(sub1)(sub2) */
function molAmmonium(amine){
  var m=newMol();
  addNode(m,'Hn',0,0,'H',{color:COL.H});
  addNode(m,'N',DX,0,'N',{color:COL.N, charge:'+'});
  addNode(m,'Hx',DX,-DY,'H',{color:COL.H});
  placeGroup(m,'S1',2*DX,0,amine.sub1,{});
  placeGroup(m,'S2',DX,DY,amine.sub2,{});
  addBond(m,'Hn','N'); addBond(m,'N','Hx'); addBond(m,'N','S1'); addBond(m,'N','S2');
  return m;
}

/* เอมีนอิสระ (ผลิตภัณฑ์) */
function molAminePlain(amine){ return molAmine(amine,{}); }

/* ชิ้นส่วนหลังตัดพันธะ: ฝั่งแอซิล  R—C(=O)—[?] */
function molAcylFragment(acid, capText, capColor, capCharge){
  var m=newMol();
  placeGroup(m,'R',0,0,acid.R,{});
  addNode(m,'C',DX,0,'C',{});
  addNode(m,'Ocarb',DX,-DY,'O',{color:COL.O});
  addBond(m,'R','C'); addBond(m,'C','Ocarb',{order:2});
  if(capText){
    addNode(m,'Cap',2*DX,0,capText,{color:capColor||COL.O, charge:capCharge||''});
    addBond(m,'C','Cap',{cls:'newbond'});
  } else {
    addNode(m,'Slot',2*DX,0,'?',{color:COL.dim, cls:'slot', hit:'slotC'});
    addBond(m,'C','Slot',{cls:'dash'});
  }
  return m;
}

/* ชิ้นส่วนฝั่งไนโตรเจน  [?]—N(sub1)(sub2) */
function molAmineFragment(amine, capText){
  var m=newMol();
  if(capText){
    addNode(m,'Cap',0,0,capText,{color:COL.H});
    addBond(m,'Cap','N',{cls:'newbond'});
  } else {
    addNode(m,'Slot',0,0,'?',{color:COL.dim, cls:'slot', hit:'slotN'});
    addBond(m,'Slot','N',{cls:'dash'});
  }
  addNode(m,'N',DX,0,'N',{color:COL.N});
  placeGroup(m,'S1',2*DX,0,amine.sub1,{});
  placeGroup(m,'S2',DX,DY,amine.sub2,{});
  addBond(m,'N','S1'); addBond(m,'N','S2');
  return m;
}

/* ==========================================================
   ตัววาด SVG
   ========================================================== */
function boxOf(n){ return { x1:n.x-n.w/2, x2:n.x+n.w/2, y1:n.y-n.h/2, y2:n.y+n.h/2 }; }

/* หาจุดตัดของเส้นจากจุดศูนย์กลาง node ไปยังทิศ (dx,dy) กับกรอบ node */
function edgePoint(n, dx, dy){
  var hw=n.w/2+4, hh=n.h/2+4;
  if(n.kind==='ring'){ hw=26; hh=26; }
  var t=Infinity;
  if(Math.abs(dx)>1e-6) t=Math.min(t, hw/Math.abs(dx));
  if(Math.abs(dy)>1e-6) t=Math.min(t, hh/Math.abs(dy));
  if(!isFinite(t)) t=0;
  return { x:n.x+dx*t, y:n.y+dy*t };
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMol(mol, opt){
  opt=opt||{};
  var pad = opt.pad||34;
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(var i=0;i<mol.nodes.length;i++){
    var b=boxOf(mol.nodes[i]);
    minX=Math.min(minX,b.x1); maxX=Math.max(maxX,b.x2);
    minY=Math.min(minY,b.y1); maxY=Math.max(maxY,b.y2);
  }
  if(minX>maxX){ minX=0;maxX=10;minY=0;maxY=10; }
  var vx=minX-pad, vy=minY-pad, vw=(maxX-minX)+pad*2, vh=(maxY-minY)+pad*2;

  var s='';
  /* พันธะ */
  for(var k=0;k<mol.bonds.length;k++){
    var bd=mol.bonds[k];
    var na=getNode(mol,bd.a), nb=getNode(mol,bd.b);
    if(!na||!nb) continue;
    var dx=nb.x-na.x, dy=nb.y-na.y;
    var L=Math.sqrt(dx*dx+dy*dy)||1;
    var ux=dx/L, uy=dy/L;
    var p1=edgePoint(na,ux,uy), p2=edgePoint(nb,-ux,-uy);
    var dash = bd.cls.indexOf('dash')>=0 ? ' stroke-dasharray="6 6"' : '';
    var cls='bond '+bd.cls;
    if(bd.order===2){
      var px=-uy*4, py=ux*4;
      s+='<line class="'+cls+'" x1="'+(p1.x+px)+'" y1="'+(p1.y+py)+'" x2="'+(p2.x+px)+'" y2="'+(p2.y+py)+'"/>';
      s+='<line class="'+cls+'" x1="'+(p1.x-px)+'" y1="'+(p1.y-py)+'" x2="'+(p2.x-px)+'" y2="'+(p2.y-py)+'"/>';
    } else {
      s+='<line class="'+cls+'"'+dash+' x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'"/>';
    }
    if(bd.hit){
      s+='<line class="bondhit" data-hit="'+bd.hit+'" x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'"/>';
    }
  }
  /* อะตอม */
  for(var j=0;j<mol.nodes.length;j++){
    var n=mol.nodes[j];
    if(n.hidden) continue;
    var g='<g class="node '+n.cls+'" data-node="'+n.id+'">';
    if(n.kind==='ring'){
      var R=24, pts=[];
      for(var a=0;a<6;a++){
        var ang=Math.PI/180*(180+a*60);
        pts.push((n.x+R*Math.cos(ang)).toFixed(1)+','+(n.y+R*Math.sin(ang)).toFixed(1));
      }
      g+='<polygon class="ring" points="'+pts.join(' ')+'"/>';
      g+='<circle class="ringin" cx="'+n.x+'" cy="'+n.y+'" r="'+(R-7)+'"/>';
    } else {
      g+='<rect class="nodebg" x="'+(n.x-n.w/2)+'" y="'+(n.y-n.h/2)+'" width="'+n.w+'" height="'+n.h+'" rx="7"/>';
      g+='<text class="atom" x="'+n.x+'" y="'+(n.y+1)+'" fill="'+n.color+'">'+esc(n.text)+'</text>';
    }
    if(n.charge){
      g+='<circle class="chg" cx="'+(n.x+n.w/2+2)+'" cy="'+(n.y-n.h/2-1)+'" r="9"/>';
      g+='<text class="chgt" x="'+(n.x+n.w/2+2)+'" y="'+(n.y-n.h/2)+'">'+esc(n.charge)+'</text>';
    }
    g+='</g>';
    s+=g;
    if(n.hit){
      var hw=Math.max(n.w,34)/2+6, hh=Math.max(n.h,34)/2+6;
      s+='<rect class="nodehit" data-hit="'+n.hit+'" x="'+(n.x-hw)+'" y="'+(n.y-hh)+'" width="'+(hw*2)+'" height="'+(hh*2)+'" rx="10"/>';
    }
  }
  for(var e=0;e<(mol.extras||[]).length;e++) s+=mol.extras[e];

  var maxw = opt.maxw ? ('max-width:'+opt.maxw+'px;') : '';
  return '<svg class="mol '+(opt.cls||'')+'" style="'+maxw+'" viewBox="'+vx+' '+vy+' '+vw+' '+vh+'" preserveAspectRatio="xMidYMid meet">'+s+'</svg>';
}

/* วางหลายโมเลกุลเรียงกันพร้อมเครื่องหมาย + หรือ ลูกศร */
function molRow(items){
  /* items: [{mol:..}, {sym:'+'}, {mol:..}] */
  var parts=[];
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.sym) parts.push('<div class="rowsym">'+it.sym+'</div>');
    else parts.push('<div class="rowmol">'+renderMol(it.mol,it.opt||{})+(it.cap?'<div class="molcap">'+it.cap+'</div>':'')+'</div>');
  }
  return '<div class="molrow">'+parts.join('')+'</div>';
}

/* วาง URL ของ Google Apps Script Web App ตรงนี้ (หรือกรอกในหน้า ตั้งค่า) */
var GAS_URL = '';

var G = {
  student: { name:'', sid:'', room:'' },
  screen: 'login',
  progress: {},          /* missionId -> {score, wrong, hints, sec, done} */
  events: [],            /* log รายข้อ */
  queue: [],             /* คิวส่ง Sheets ที่ยังไม่สำเร็จ */
  sessionStart: Date.now(),
  online: false
};

function totalScore(){
  var s=0; for(var k in G.progress){ if(G.progress[k].done) s+=G.progress[k].score; } return s;
}
function maxScore(){ return (SYNTH_MISSIONS.length + HYDRO_MISSIONS.length + ISO_MISSIONS.length) * 10; }
function doneCount(){ var c=0; for(var k in G.progress){ if(G.progress[k].done) c++; } return c; }

function scoreFor(wrong, hints){
  var s = 10 - wrong*2 - hints*3;
  return Math.max(3, s);
}

function saveMission(mode, mission, wrong, hints, sec, detail){
  var prev = G.progress[mission.id];
  var sc = scoreFor(wrong, hints);
  if(!prev || sc > prev.score || !prev.done){
    G.progress[mission.id] = { score:sc, wrong:wrong, hints:hints, sec:sec, done:true, mode:mode };
  }
  var ev = {
    ts: new Date().toISOString(),
    sid: G.student.sid, name: G.student.name, room: G.student.room,
    mode: mode, missionId: mission.id, missionTitle: mission.title,
    score: sc, wrong: wrong, hints: hints, seconds: sec,
    lv: mission.lv, hots: (mission.hots||[]).join('+'), scope: scopeOf(mission),
    detail: detail ? JSON.stringify(detail) : ''
  };
  G.events.push(ev);
  sendToSheet('event', ev);
  return sc;
}

/* ---------- Google Sheets ---------- */
function sendToSheet(kind, data){
  if(!GAS_URL){ return; }
  var payload = { kind:kind, version:APP_VERSION, game:'AMIDE_FORGE', data:data };
  try{
    fetch(GAS_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.text(); })
      .then(function(){ G.online = true; setSyncBadge(true); flushQueue(); })
      .catch(function(){ G.online=false; G.queue.push(payload); setSyncBadge(false); });
  }catch(e){ G.queue.push(payload); setSyncBadge(false); }
}
function flushQueue(){
  if(!GAS_URL || !G.queue.length) return;
  var q = G.queue.slice(); G.queue = [];
  q.forEach(function(p){
    fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)})
      .catch(function(){ G.queue.push(p); });
  });
}
function sendSummary(){
  var sum = {
    ts: new Date().toISOString(),
    sid:G.student.sid, name:G.student.name, room:G.student.room,
    total: totalScore(), max: maxScore(), missions: doneCount(),
    minutes: Math.round((Date.now()-G.sessionStart)/60000),
    detail: JSON.stringify(G.progress)
  };
  sendToSheet('summary', sum);
  return sum;
}
function setSyncBadge(ok){
  var el = document.getElementById('syncDot');
  if(!el) return;
  el.className = 'syncdot ' + (GAS_URL ? (ok?'on':'off') : 'none');
  el.title = GAS_URL ? (ok?'ซิงก์กับ Google Sheets แล้ว':'ยังส่งข้อมูลไม่สำเร็จ') : 'ยังไม่ได้ตั้งค่า Google Sheets';
}

/* เสียงสังเคราะห์สั้น ๆ (ไม่ต้องโหลดไฟล์) */
var AC=null;
function beep(freq, dur, type){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.14, AC.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+(dur||0.2));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+(dur||0.2)+0.02);
  }catch(e){}
}

function synthDoneView(){
  var amide = molAmide(S.acid, S.amine, {});

  var res = evalSynth();

  var eq = '<div class="eqbox">'

              {mol:amide,cap:'<b>'+nm+'</b>'},{sym:'+'},{mol:water,cap:'น้ำ'}])

  var poly='';
  if(S.m && S.m.polymer && res.ok){
    poly = '<div class="polybox">'
      + '<div class="polylab">ปลายทั้งสองข้างยังว่าง → ต่อได้ไม่รู้จบ</div>'
      + '<div class="polychain">'
      + '<span class="unit">…</span>'

      + '<span class="unit hi2">CO(CH₂)₄CO</span><span class="link">—</span>'
      + '<span class="unit hi">HN(CH₂)₆NH</span><span class="link">—</span>'
      + '<span class="unit hi2">CO(CH₂)₄CO</span>'

      + '</div>'
      + '<div class="polyfoot">ไนลอน 6,6 · พอลิเอไมด์ · คายน้ำออก 2n โมเลกุล</div>'
      + '</div>';
  }

  var badge;

    badge = '<div class="verdict ok"><div class="vbig">เกิดเอไมด์แล้ว</div><div>ลองเปลี่ยนคู่สารแล้วสังเกตว่าชื่อเปลี่ยนไปอย่างไร</div></div>';
  } else if(res.ok){
    badge = '<div class="verdict ok"><div class="vbig">สำเร็จ</div><div>'+res.msg+'</div><div class="vscore">+'+res.score+' คะแนน</div></div>';
  } else {
    badge = '<div class="verdict no"><div class="vbig">ยังไม่ตรงเป้าหมาย</div><div>'+res.msg+'</div></div>';
  }

  var info = '<div class="prodcard">'
    + '<div class="pname">'+nm+'</div>'
    + '<div class="pmeta"><span>สูตรโมเลกุล <b>'+fmtFormula(at)+'</b></span><span>หมู่ฟังก์ชัน <b>เอไมด์ (–CONH–)</b></span></div>'
    + '<div class="pnote">ส่วนหน้าชื่อมาจาก<b>เอมีน</b> · ส่วนท้ายชื่อมาจาก<b>กรดคาร์บอกซิลิก</b></div>'
    + '</div>';

  var reflect = (res.ok && S.m) ? '<div class="note think"><b>คิดต่อ:</b> '+S.m.reflect+'</div>'+extNoteHTML(S.m) : '';

  var btns = res.ok
    ? '<button class="btn ghost" data-act="again">ทำใหม่</button><button class="btn primary" data-act="next">ภารกิจถัดไป</button>'
    : '<button class="btn primary" data-act="again">ลองใหม่</button>';
  if(!S.m) btns = '<button class="btn primary" data-act="again">ผสมคู่ใหม่</button>';

  return eq + info + poly + badge + reflect + '<div class="dock">'+btns+'</div>';
}

/* ---------- ตรวจผล ---------- */
function evalSynth(){
  if(!S.m){ return {ok:true, msg:'สำรวจได้ตามใจในโหมดอิสระ', score:0, free:true}; }
  var w=S.m.want;
  if(S.acid.id===w.acid && S.amine.id===w.amine){
    if(!S._scored){
      S._scored = saveMission('synth', S.m, S.wrong, S.hints, synthSec());
      sfxWin();
    }
    return {ok:true, msg:'ได้ผลิตภัณฑ์ตรงตามภารกิจ', score:S._scored};
  }
  var wantAcid=acidById(w.acid), wantAmine=amineById(w.amine);
  var got=amideAtoms(S.acid,S.amine), tgt=amideAtoms(wantAcid,wantAmine);
  var sameF = fmtFormula(got)===fmtFormula(tgt);
  var msg;
  if(sameF){
    msg = 'สูตรโมเลกุลถูกต้อง ('+fmtFormula(got)+') แต่ยังไม่ตรงเงื่อนไขของภารกิจ — สารที่ได้คือ '+amideName(S.acid,S.amine)+' ซึ่งเป็นไอโซเมอร์ของเป้าหมาย';
  } else {
    msg = 'สารที่ได้คือ '+amideName(S.acid,S.amine)+' (สูตร '+fmtFormula(got)+') ลองอ่านชื่อเป้าหมายทีละส่วนแล้วเลือกใหม่';
  }
  return {ok:false, msg:msg};
}

var WRONGMSG = {
  R:'หมู่ R คือโครงคาร์บอนหลักของกรด ถ้าดึงออกไปจะไม่เหลือสารเดิม',
  C:'คาร์บอนตัวนี้จะกลายเป็นคาร์บอนของหมู่เอไมด์ ต้องอยู่ต่อ',
  Ocarb:'ออกซิเจนตัวนี้เป็นพันธะคู่ในหมู่คาร์บอนิล (C=O) ซึ่งยังคงอยู่ในเอไมด์',
  N:'ไนโตรเจนคือหัวใจของหมู่เอไมด์ ถ้าหลุดไปก็ไม่เกิดพันธะ C–N',
  S1:'หมู่นี้เกาะอยู่บนไนโตรเจนและจะยังเกาะอยู่ต่อในเอไมด์ (มันจะกลายเป็นคำนำหน้า N-…)',
  S2:'หมู่นี้เกาะอยู่บนไนโตรเจนและจะยังเกาะอยู่ต่อในเอไมด์ (มันจะกลายเป็นคำนำหน้า N-…)'
};

function synthHit(hit){
  if(S.stage!=='hot') return;
  if(hit==='OH' || hit==='NH'){
    if(S.taken.indexOf(hit)>=0) return;
    S.taken.push(hit);
    sfxPop(); buzz(14);
    drawSynth();
    if(S.taken.length===2){
      setTimeout(function(){
        S.stage='done'; sfxGood(); drawSynth();
      }, 950);
    }
    return;
  }
  S.wrong++;
  sfxBad(); buzz([20,40,20]);
  toast('<b>ยังไม่ใช่ตรงนี้</b><br>'+(WRONGMSG[hit]||'ลองดูใหม่ว่าอะตอมไหนหายไปแล้วยังเหลือหมู่ –CO–NH–'),'bad');
}

function synthAct(act, id){
  if(act==='pickAcid'){ S.acid=acidById(id); sfxPop(); drawSynth(); }
  else if(act==='pickAmine'){ S.amine=amineById(id); sfxPop(); drawSynth(); }
  else if(act==='mix'){
    if(!S.acid||!S.amine) return;
    S.stage='salt'; S.temp=25; sfxPop(); drawSynth();
  }
  else if(act==='heat'){
    if(S.temp<100){ toast('อุณหภูมิยังต่ำกว่า 100 °C เกลือจึงยังไม่คายน้ำ','bad'); return; }
    S.stage='hot'; S.taken=[]; sfxPop(); drawSynth();
  }
  else if(act==='back'){ S.stage='pick'; drawSynth(); }
  else if(act==='resetStep'){ S.taken=[]; drawSynth(); }
  else if(act==='hint'){
    if(!S.m){ toast('โหมดอิสระไม่มีคำใบ้ ลองเลือกคู่ที่อยากรู้ได้เลย'); return; }
    if(!S._hinted){ S.hints=1; S._hinted=true; }
    toast('<b>คำใบ้</b><br>'+S.m.hint);
  }
  else if(act==='again'){
    startSynth(S.m);
  }
  else if(act==='next'){
    var i=-1;
    for(var k=0;k<SYNTH_MISSIONS.length;k++) if(SYNTH_MISSIONS[k].id===S.m.id) i=k;
    if(i>=0 && i+1<SYNTH_MISSIONS.length) startSynth(SYNTH_MISSIONS[i+1]);
    else go('synthList');
  }
}

var H = null;

function startHydro(mission, freePair){
  var acid, amine, cond;
  if(mission){ acid=acidById(mission.acid); amine=amineById(mission.amine); cond=mission.cond; }
  else { acid=freePair.acid; amine=freePair.amine; cond=null; }
  H = { m:mission, acid:acid, amine:amine, cond:null, want:cond,
        stage:'cond', temp:25, slots:{slotC:null, slotN:null}, sel:null,
        wrong:0, hints:0, t0:Date.now(), triedWater:false };
  G.screen='hydro';
  drawHydro();
}
function hydroSec(){ return Math.round((Date.now()-H.t0)/1000); }

function hHead(){
  var m=H.m;
  return '<div class="mhead hyd">'
   + '<div class="mtitle">'+(m?('<span class="mid">'+m.id+'</span> '+m.title):'โหมดอิสระ: ผ่าพันธะเอไมด์')+'</div>'
   + (m?'<div class="mtags">'+metaTags(m)+'</div>':'')
   + '<div class="mbrief">'+(m?m.brief:'เลือกภาวะแล้วลองตัดพันธะเอไมด์ดูว่าได้อะไร')+'</div>'
   + '</div>';
}

function drawHydro(){
  var body='';
  if(H.stage==='cond') body=hCondView();
  else if(H.stage==='heat') body=hHeatView();
  else if(H.stage==='cut') body=hCutView();
  else if(H.stage==='assign') body=hAssignView();
  else if(H.stage==='done') body=hDoneView();
  $('view').innerHTML='<div class="lab hydrolab">'+hHead()+body+'</div>';
  bindRange();
  refreshTop();
}

function condLabel(c){
  if(c==='acid') return 'ภาวะกรด (H⁺, Δ)';
  if(c==='base') return 'ภาวะเบส (NaOH, Δ)';
  return 'น้ำเปล่า';
}

    + 'เลือก<b>ตัวทำปฏิกิริยา</b>ที่จะใช้ผ่ามันดู</div>'

    + '<button class="condbtn water" data-act="cond" data-id="water"><span class="cico">💧</span><b>น้ำเปล่า</b><small>H₂O อย่างเดียว</small></button>'
    + '<button class="condbtn acid" data-act="cond" data-id="acid"><span class="cico">🔥</span><b>ภาวะกรด</b><small>H₃O⁺ / H⁺, Δ</small></button>'
    + '<button class="condbtn base" data-act="cond" data-id="base"><span class="cico">🧴</span><b>ภาวะเบส</b><small>NaOH, Δ</small></button>'
    + '</div>'
    + '<div class="dock"><button class="btn ghost" data-act="hint">คำใบ้</button></div>';
}

function hHeatView(){
  var amide = molAmide(H.acid,H.amine,{});
  return '<div class="bench">'
    + '<div class="benchlab">'+condLabel(H.cond)+'</div>'
    + renderMol(amide,{})
    + '</div>'
    + '<div class="note warn">พันธะเอไมด์เฉื่อย จึงต้องใช้ทั้งกรด/เบส <b>และความร้อน</b> ปฏิกิริยาจึงจะเดินหน้า'

}

function burnerHTML2(){

function hCutView(){
  var amide = molAmide(H.acid,H.amine,{hits:true});
  return '<div class="bench cut">'
    + '<div class="benchlab hotlab">'+H.temp+' °C · '+condLabel(H.cond)+'</div>'
    + renderMol(amide,{})
    + '</div>'
    + '<div class="note act">น้ำจะเข้าไปตัดพันธะเพียงพันธะเดียวเท่านั้น — <b>แตะเส้นพันธะ</b>ที่คิดว่าเป็นพันธะเอไมด์</div>'

    + '<button class="btn ghost" data-act="hback2">ย้อนกลับ</button></div>';
}

function pieceSet(){
  if(H.cond==='base') return [{id:'ONa', label:'–O⁻ Na⁺', cls:'o'},{id:'H', label:'–H', cls:'h'}];
  return [{id:'OH', label:'–OH', cls:'o'},{id:'H', label:'–H', cls:'h'}];
}
function correctFor(slot){
  if(slot==='slotC') return (H.cond==='base') ? 'ONa' : 'OH';
  return 'H';
}
function pieceLabel(id){
  if(id==='OH' || id==='ONa') return 'O';
  return 'H';
}

function hAssignView(){
  var capC = H.slots.slotC ? pieceLabel(H.slots.slotC) : null;
  var acyl = molAcylFragment(H.acid, capC, COL.O, (H.slots.slotC==='ONa'?'–':''));
  if(H.slots.slotC==='ONa'){
    addNode(acyl,'Na',3*DX,0,'Na',{color:COL.Na,charge:'+'});
  }
  if(H.slots.slotC==='OH'){
    addNode(acyl,'Hoh',3*DX,0,'H',{color:COL.H});
    addBond(acyl,'Cap','Hoh',{cls:'newbond'});
  }
  if(H.slots.slotC==='H'){
    /* วางผิด: H ไปเกาะคาร์บอนิล */
  }
  var capN = H.slots.slotN ? pieceLabel(H.slots.slotN) : null;
  var amin = molAmineFragment(H.amine, capN);

  var pieces = pieceSet().map(function(p){
    var used = (H.slots.slotC===p.id || H.slots.slotN===p.id);
    return '<button class="piecebtn '+p.cls+(H.sel===p.id?' sel':'')+(used?' used':'')+'" data-act="pick2" data-id="'+p.id+'" '+(used?'disabled':'')+'>'+p.label+'</button>';
  }).join('');

  var waterNote = (H.cond==='base')
    ? 'ในภาวะเบส สิ่งที่เข้าชนคาร์บอนคาร์บอนิลคือ <b>OH⁻</b> ซึ่งจับคู่กับ Na⁺'
    : 'ในภาวะกรด น้ำแตกออกเป็น <b>–OH</b> กับ <b>–H</b> แล้วไปเติมที่ปลายทั้งสองข้าง';

  return '<div class="bench frag">'
    + '<div class="fragbox">'+renderMol(acyl,{})+'<div class="molcap">ชิ้นส่วนที่มีหมู่คาร์บอนิล</div></div>'
    + '<div class="fragbox">'+renderMol(amin,{})+'<div class="molcap">ชิ้นส่วนที่มีไนโตรเจน</div></div>'
    + '</div>'
    + '<div class="note act">แตะเลือกชิ้นส่วนจากน้ำ แล้วแตะช่อง <b>?</b> ที่จะนำไปเติม<br><small>'+waterNote+'</small></div>'
    + '<div class="pieces">'+pieces+'</div>'
    + '<div class="dock"><button class="btn ghost" data-act="hint">คำใบ้</button>'
    + '<button class="btn ghost" data-act="resetAssign">ล้างช่อง</button></div>';
}

function hDoneView(){
  var amide = molAmide(H.acid,H.amine,{});
  var p1 = (H.cond==='base') ? molCarboxylate(H.acid,true) : molAcid(H.acid,{});
  var p1cap = (H.cond==='base') ? 'เกลือคาร์บอกซิเลต (–COO⁻Na⁺)' : H.acid.name;
  var p2 = molAminePlain(H.amine);
  var p2cap = H.amine.name + (H.cond==='acid' ? ' (อยู่ในรูปเกลือแอมโมเนียม)' : '');

  var arrow = '<span class="rxn">→<small>'+(H.cond==='base'?'NaOH, Δ':'H⁺, Δ')+'</small></span>';
  var eq = '<div class="eqbox">'
    + molRow([{mol:amide,cap:amideName(H.acid,H.amine)},{sym:'+'},{mol:molWater(),cap:'น้ำ'},
              {sym:arrow},{mol:p1,cap:'<b>'+p1cap+'</b>'},{sym:'+'},{mol:p2,cap:'<b>'+p2cap+'</b>'}])
    + '</div>';

  var res = evalHydro();
  var badge;
  if(!res.ok){
    badge = '<div class="verdict no"><div class="vbig">ผลิตภัณฑ์ยังไม่ถูก</div><div>'+res.msg+'</div></div>';
  } else if(!H.m){
    badge = '<div class="verdict ok"><div class="vbig">ตัดสำเร็จ</div><div>'+res.msg+'</div></div>';
  } else {
    badge = '<div class="verdict ok"><div class="vbig">ตัดสำเร็จ</div><div>'+res.msg+'</div>'
          + (res.score?'<div class="vscore">+'+res.score+' คะแนน</div>':'')+'</div>';
  }

  var cmp = '<div class="cmp"><div class="cmphead">เทียบสองภาวะ</div>'
    + '<div class="cmprow'+(H.cond==='acid'?' now':'')+'"><span class="ctag a">กรด</span>'
    + 'ได้ <b>กรดคาร์บอกซิลิก</b> + <b>เอมีน</b> (ในรูปเกลือแอมโมเนียม เพราะเอมีนรับ H⁺)</div>'
    + '<div class="cmprow'+(H.cond==='base'?' now':'')+'"><span class="ctag b">เบส</span>'
    + 'ได้ <b>เกลือคาร์บอกซิเลต</b> + <b>เอมีน</b> · กรดคาร์บอกซิลิกที่เกิดขึ้นทำปฏิกิริยากับ NaOH เป็นเกลือ</div></div>';

  var reflect = (res.ok && H.m) ? '<div class="note think"><b>คิดต่อ:</b> '+H.m.reflect+'</div>'+extNoteHTML(H.m) : '';
  var btns = res.ok
    ? '<button class="btn ghost" data-act="hagain">ทำใหม่</button><button class="btn primary" data-act="hnext">ภารกิจถัดไป</button>'
    : '<button class="btn primary" data-act="hagain">ลองใหม่</button>';
  if(!H.m) btns='<button class="btn primary" data-act="hagain">ทดลองใหม่</button>';

  return eq + badge + cmp + reflect + '<div class="dock">'+btns+'</div>';
}

function evalHydro(){
  var okC = H.slots.slotC===correctFor('slotC');
  var okN = H.slots.slotN===correctFor('slotN');
  if(!(okC&&okN)){
    return {ok:false, msg:'ลองดูว่าปลายที่มีคาร์บอนิล (C=O) ควรได้รับอะไร จึงจะกลายเป็นหมู่ –COOH หรือ –COO⁻'};
  }
  if(H.m && H.cond!==H.m.cond){
    return {ok:true, msg:'ตัดพันธะและเติมชิ้นส่วนถูกต้อง แต่ภาวะที่ใช้ไม่ตรงกับที่ภารกิจกำหนด', score:0, offcond:true};
  }
  if(!H._scored && H.m){ H._scored = saveMission('hydro', H.m, H.wrong, H.hints, hydroSec()); sfxWin(); }
  return {ok:true, msg:'ผลิตภัณฑ์ถูกต้องครบทั้งสองชิ้น', score:(H.m?H._scored:0)};
}

/* ---------- การแตะ ---------- */
var BONDMSG = {
  b_RC:'พันธะนี้อยู่ระหว่างหมู่ R กับคาร์บอนคาร์บอนิล เป็นพันธะ C–C ธรรมดา น้ำตัดไม่ได้',
  b_CO:'นี่คือพันธะคู่ C=O ของหมู่คาร์บอนิล ซึ่งยังคงอยู่ในผลิตภัณฑ์ทั้งสองภาวะ',
  b_NS1:'พันธะนี้ต่อไนโตรเจนกับหมู่แทนที่ ไม่ใช่พันธะเอไมด์ จึงไม่ถูกไฮโดรไลส์',
  b_NS2:'พันธะนี้ต่อไนโตรเจนกับหมู่แทนที่ ไม่ใช่พันธะเอไมด์ จึงไม่ถูกไฮโดรไลส์'
};

function hydroHit(hit){
  if(H.stage==='cut'){
    if(hit==='b_CN'){
      sfxGood(); buzz(24);
      H.stage='assign'; drawHydro();
      toast('ตัดพันธะเอไมด์แล้ว ตอนนี้ต้องเติมชิ้นส่วนจากน้ำให้ถูกที่');
      return;
    }
    if(BONDMSG[hit]){ H.wrong++; sfxBad(); buzz([20,40,20]); toast('<b>ตัดตรงนี้ไม่ได้</b><br>'+BONDMSG[hit],'bad'); }
    return;
  }
  if(H.stage==='assign'){
    if(hit==='slotC'||hit==='slotN'){
      if(!H.sel){ toast('เลือกชิ้นส่วนจากน้ำด้านล่างก่อน'); return; }
      var need = correctFor(hit);
      if(H.sel===need){
        H.slots[hit]=H.sel; H.sel=null; sfxPop(); drawHydro();
        if(H.slots.slotC&&H.slots.slotN){
          setTimeout(function(){ H.stage='done'; drawHydro(); }, 800);
        }
      } else {
        H.wrong++; sfxBad();
        var msg = (hit==='slotN')
          ? 'ไนโตรเจนต้องได้รับ <b>H</b> จึงจะกลับไปเป็นเอมีน ถ้าได้ –OH หรือ –O⁻ จะไม่ใช่หมู่เอมีนแล้ว'
          : (H.cond==='base'
              ? 'ในภาวะเบส คาร์บอนคาร์บอนิลต้องได้รับ <b>–O⁻</b> จึงจะกลายเป็นเกลือคาร์บอกซิเลต'
              : 'ในภาวะกรด คาร์บอนคาร์บอนิลต้องได้รับ <b>–OH</b> จึงจะกลายเป็นหมู่ –COOH');
        toast('<b>วางผิดที่</b><br>'+msg,'bad');
      }
    }
  }
}

function hydroAct(act,id){
  if(act==='cond'){
    if(id==='water'){
      H.triedWater=true; sfxBad();
      toast('<b>ไม่เกิดปฏิกิริยา</b><br>น้ำเปล่าอย่างเดียวไม่พอ เพราะพันธะเอไมด์เสถียรมาก ต้องมีกรดหรือเบสช่วย และต้องให้ความร้อนด้วย','bad');
      return;
    }
    if(H.m && id!==H.m.cond){
      H.wrong++;
      toast('<b>อ่านโจทย์อีกครั้ง</b><br>ภารกิจนี้กำหนดให้ใช้'+condLabel(H.m.cond)+' แต่ยังไปต่อได้ ลองดูว่าผลิตภัณฑ์จะต่างกันอย่างไร','bad');
    }
    H.cond=id; H.stage='heat'; H.temp=25; sfxPop(); drawHydro();
  }
  else if(act==='hheat'){
    if(H.temp<100){ toast('เอไมด์เฉื่อยมาก ต้องให้ความร้อนถึง 100 °C ขึ้นไป','bad'); return; }
    H.stage='cut'; sfxPop(); drawHydro();
  }
  else if(act==='hback'){ H.stage='cond'; drawHydro(); }
  else if(act==='hback2'){ H.stage='heat'; drawHydro(); }
  else if(act==='pick2'){ H.sel=id; sfxPop(); drawHydro(); }
  else if(act==='resetAssign'){ H.slots={slotC:null,slotN:null}; H.sel=null; drawHydro(); }
  else if(act==='hint'){
    if(!H.m){ toast('โหมดอิสระไม่มีคำใบ้'); return; }
    if(!H._hinted){ H.hints=1; H._hinted=true; }
    toast('<b>คำใบ้</b><br>'+H.m.hint);
  }
  else if(act==='hagain'){ if(H.m) startHydro(H.m); else startHydro(null,{acid:H.acid,amine:H.amine}); }
  else if(act==='hnext'){
    var i=-1;
    for(var k=0;k<HYDRO_MISSIONS.length;k++) if(HYDRO_MISSIONS[k].id===H.m.id) i=k;
    if(i>=0&&i+1<HYDRO_MISSIONS.length) startHydro(HYDRO_MISSIONS[i+1]);
    else go('hydroList');
  }
}


/* ===== 45_iso.js ===== */
/* ==========================================================
   AMIDE FORGE LAB — 45_iso.js
   โหมด "ห้องไอโซเมอร์" : ไอโซเมอร์โครงสร้างของเอไมด์ (ระดับวิเคราะห์ → ประเมินค่า)
   อ้างอิง: ผลการเรียนรู้ บท 12 ข้อ 5 (ไอโซเมอร์โครงสร้าง) + ข้อ 8 (เอไมด์/ไฮโดรลิซิส)
           curriculum-ref แถว 12–14 (คู่ C₆H₅COOH + CH₃NH₂ กับ CH₃COOH + C₆H₅NH₂ เป็นไอโซเมอร์โครงสร้างกัน)
   ใช้เฉพาะสารที่มีหมู่ฟังก์ชันเดียว (ไม่รวมกรดเฮกเซนไดโออิก/เฮกเซน-1,6-ไดอามีน)
   ไม่มีค่าสมบัติทางกายภาพ — หลักฐานทั้งหมดคำนวณจากสูตรและผลิตภัณฑ์ไฮโดรลิซิสในกรด (curriculum-ref แถว 13)
   ========================================================== */

/* ---------- ตัวช่วย ---------- */
function coreAcids(){ return ACIDS.filter(function(a){ return !a.di; }); }
function coreAmines(){ return AMINES.filter(function(a){ return !a.di; }); }
function sameAtoms(a, b){ return fmtFormula(a) === fmtFormula(b); }
function samePair(p, q){ return p.acid.id === q.acid.id && p.amine.id === q.amine.id; }
/* จำนวน H บน N ของเอไมด์: NH₃ → 2, เอมีน 1° → 1, เอมีน 2° → 0 */
function hOnN(amine){ return amine.deg === '—' ? 2 : (amine.deg === '1°' ? 1 : 0); }
function pairFrom(o){ return { acid: acidById(o.acid), amine: amineById(o.amine) }; }

/* คู่กรด+เอมีน (เฉพาะหมู่ฟังก์ชันเดียว) ที่ได้เอไมด์สูตรโมเลกุลตามเป้าหมาย */
function huntAnswers(formula){
  var out = [];
  coreAcids().forEach(function(a){
    coreAmines().forEach(function(b){
      if(sameAtoms(amideAtoms(a, b), formula)) out.push({ acid:a, amine:b });
    });
  });
  return out;
}

var ISO_MISSIONS = [
  { id:'I1', kind:'hunt', title:'ล่าไอโซเมอร์ C₃H₇NO',
    formula:{C:3,H:7,N:1,O:1},
    brief:'จับคู่กรดกับเอมีนจากชั้นวางให้ได้เอไมด์สูตรโมเลกุล <b>C₃H₇NO</b> ให้ครบ <b>4 โครงสร้าง</b> ที่ไม่ซ้ำกัน',
    hint:'เอไมด์ = กรด + เอมีน − H₂O ลองแจกคาร์บอนรวม 3 อะตอมให้สองฝั่งเป็น 1+2, 2+1 และ 3+0 แล้วตรวจว่า H รวมลงตัวที่ 7 ไหม',
    reflect:'สูตรโมเลกุลเดียวกัน แต่หมู่ที่เกาะบน N และความยาวโซ่ฝั่งกรดต่างกัน จึงเป็น<b>ไอโซเมอร์โครงสร้าง</b> (สูตรโมเลกุลเหมือนกัน สูตรโครงสร้างต่างกัน) · สังเกตว่าจำนวน H บน N ของเอไมด์ที่ได้เป็น 2, 1, 1 และ 0 ตามชนิดของเอมีนที่ใช้',
    lv:'analyze', hots:['STM','PRB'], iso:true, ext:false },

  { id:'I2', kind:'qc', title:'ตรวจรับล็อตเอไมด์',
    brief:'โรงงานสั่งเอไมด์ 4 ล็อต คุณเป็นผู้ตรวจรับ เลือกวิธีตรวจแล้วตัดสินว่าจะ <b>รับ</b> หรือ <b>ส่งคืน</b> โดยต้องมีหลักฐานที่พอจะตัดสินได้',
    hint:'ถ้าสูตรโมเลกุลไม่ตรงใบสั่ง ก็ส่งคืนได้เลย แต่ถ้าสูตรตรง ยังสรุปไม่ได้ เพราะไอโซเมอร์มีสูตรเหมือนกัน ต้องดูผลิตภัณฑ์ของไฮโดรลิซิสว่าได้กรดและเอมีนตัวเดิมหรือไม่',
    reflect:'สูตรโมเลกุลและหมู่ฟังก์ชันเหมือนกันยังไม่พอจะสรุปว่าเป็นสารเดียวกัน เพราะไอโซเมอร์ก็ผ่านการตรวจสองอย่างนี้ · ผลิตภัณฑ์ของไฮโดรลิซิสบอกได้ว่าเอไมด์ประกอบจากกรดและเอมีนตัวไหน จึงใช้แยกไอโซเมอร์ได้',
    rounds:[
      { order:{acid:'C6H5COOH', amine:'CH3NH2'}, actual:{acid:'CH3COOH', amine:'CH3NH2'} },
      { order:{acid:'C6H5COOH', amine:'CH3NH2'}, actual:{acid:'CH3COOH', amine:'PhNH2'} },
      { order:{acid:'C6H5COOH', amine:'CH3NH2'}, actual:{acid:'C6H5COOH', amine:'CH3NH2'} },
      { order:{acid:'CH3COOH',  amine:'CH3NH2'}, actual:{acid:'HCOOH',    amine:'C2H5NH2'} }
    ],
    lv:'evaluate', hots:['CTC','PRB'], iso:true, ext:false }
];

var I = null;

function startIso(m){
  I = { m:m, kind:m.kind, wrong:0, hints:0, t0:Date.now(), done:false };
  if(m.kind === 'hunt'){
    I.acid = null; I.amine = null; I.found = []; I.last = null;
    I.total = huntAnswers(m.formula).length;
  } else {
    I.ri = 0; I.tests = {}; I.rlog = []; I.rwrong = 0; I.closed = null;
  }
  G.screen = 'iso';
  drawIso();
}
function isoSec(){ return Math.round((Date.now() - I.t0) / 1000); }

function isoHead(){
  var m = I.m;
  return '<div class="mhead iso">'
    + '<div class="mtitle"><span class="mid">'+m.id+'</span> '+m.title+'</div>'
    + '<div class="mtags">'+metaTags(m)+'</div>'
    + '<div class="mbrief">'+m.brief+'</div></div>';
}

function drawIso(){
  var body;
  if(I.kind === 'hunt') body = I.done ? isoHuntDone() : isoHuntView();
  else body = I.done ? isoQcDone() : isoQcView();
  $('view').innerHTML = '<div class="lab isolab">' + isoHead() + body + '</div>';
  refreshTop();
}

/* ---------- ภารกิจ I1: ล่าไอโซเมอร์ ---------- */
function isoShelf(){
  var a = '', b = '';
  coreAcids().forEach(function(x){
    a += '<button class="chip '+(I.acid && I.acid.id === x.id ? 'sel' : '')+'" data-act="iAcid" data-id="'+x.id+'">'
       + '<span class="chipname">'+x.name+'</span><span class="chipf">'+x.formula+'</span></button>';
  });
  coreAmines().forEach(function(x){
    b += '<button class="chip amine '+(I.amine && I.amine.id === x.id ? 'sel' : '')+'" data-act="iAmine" data-id="'+x.id+'">'
       + '<span class="chipname">'+x.name+'</span><span class="chipf">'+x.formula+'</span></button>';
  });
  return '<div class="shelf"><div class="shelflab"><b>ชั้นวางกรดคาร์บอกซิลิก</b></div><div class="chips">'+a+'</div></div>'
       + '<div class="shelf"><div class="shelflab amine"><b>ชั้นวางแอมโมเนีย / เอมีน</b></div><div class="chips">'+b+'</div></div>';
}

/* บัญชีอะตอม: กรด + เอมีน − H₂O (แสดงหลังกดตรวจสูตรเท่านั้น) */
function ledgerHTML(acid, amine, target){
  var lose = { C:0, H:2, N:0, O:1 };
  var got = amideAtoms(acid, amine);
  var rows = '';
  ['C','H','N','O'].forEach(function(el){
    var ok = (got[el] || 0) === (target[el] || 0);
    rows += '<tr class="'+(ok ? 'ok' : 'no')+'"><td>'+el+'</td>'
      + '<td>'+acid.at[el]+' + '+amine.at[el]+' − '+lose[el]+' = <b>'+got[el]+'</b></td>'
      + '<td>'+(target[el] || 0)+'</td><td>'+(ok ? '✓' : '✗')+'</td></tr>';
  });
  return '<table class="ledger"><thead><tr><th>อะตอม</th><th>กรด + เอมีน − น้ำ</th><th>เป้าหมาย</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function isoHuntView(){
  var m = I.m;
  var head = '<div class="isoprog"><div class="isotarget"><small>สูตรโมเลกุลเป้าหมาย</small><b>'+fmtFormula(m.formula)+'</b></div>'
    + '<div class="isocount"><small>พบแล้ว</small><b>'+I.found.length+' / '+I.total+'</b></div></div>';

  var items = [];
  if(I.acid) items.push({ mol:molAcid(I.acid, {}), cap:I.acid.name, opt:{ maxw:190 } });
  if(I.acid && I.amine) items.push({ sym:'+' });
  if(I.amine) items.push({ mol:molAmine(I.amine, {}), cap:I.amine.name+(I.amine.deg !== '—' ? ' · เอมีน'+I.amine.deg : ''), opt:{ maxw:190 } });
  var bench = items.length ? '<div class="bench">'+molRow(items)+'</div>'
                           : '<div class="bench empty">เลือกกรดกับเอมีนจากชั้นวาง แล้วกดเชื่อมเพื่อตรวจสูตรโมเลกุลของเอไมด์ที่ได้</div>';

  var res = '';
  if(I.last){
    var L = I.last, nm = amideName(L.acid, L.amine);
    var msg = L.res === 'ok'  ? '<b>สูตรตรงเป้าหมาย</b> เก็บ '+nm+' เข้าสมุดแล้ว'
            : L.res === 'dup' ? '<b>เก็บโครงสร้างนี้แล้ว</b> ('+nm+') ต้องหาโครงสร้างอื่นที่ไม่ซ้ำ'
            : '<b>สูตรไม่ตรง</b> เอไมด์ที่ได้คือ '+nm+' สูตร '+fmtFormula(amideAtoms(L.acid, L.amine))+' · ดูบัญชีอะตอมว่าธาตุไหนไม่ลงตัว';
    res = '<div class="verdict '+(L.res === 'no' ? 'no' : 'ok')+'">'+msg+'</div>'
        + ledgerHTML(L.acid, L.amine, m.formula);
  }

  var nb = '';
  if(I.found.length){
    nb = '<div class="nbhead">สมุดไอโซเมอร์ของ '+fmtFormula(m.formula)+'</div><div class="nbgrid">'
      + I.found.map(function(f){
          return '<div class="nbcard"><div class="nbname">'+amideName(f.acid, f.amine)+'</div>'
            + renderMol(molAmide(f.acid, f.amine, {}), { maxw:170 })
            + '<div class="nbmeta">'+f.acid.name+' + '+f.amine.name+'</div></div>';
        }).join('') + '</div>';
  }

  return head + bench + res + isoShelf()
    + '<div class="dock"><button class="btn ghost" data-act="hint">คำใบ้</button>'
    + '<button class="btn primary" data-act="iCheck" '+((I.acid && I.amine) ? '' : 'disabled')+'>เชื่อมและตรวจสูตร</button></div>'
    + nb;
}

function isoHuntDone(){
  var m = I.m;
  var score = I._scored;
  var rows = I.found.map(function(f){
    return '<tr><td>'+amideName(f.acid, f.amine)+'</td><td>'+f.acid.name+' + '+f.amine.name+'</td><td class="num">'+hOnN(f.amine)+'</td></tr>';
  }).join('');
  return '<div class="verdict ok"><div class="vbig">ครบทุกโครงสร้าง</div>'
    + '<div>พบเอไมด์สูตร '+fmtFormula(m.formula)+' ครบ '+I.total+' โครงสร้างโดยไม่ซ้ำกัน</div>'
    + '<div class="vscore">+'+score+' คะแนน</div></div>'
    + '<table class="stab"><thead><tr><th>เอไมด์</th><th>สารตั้งต้น</th><th>H บน N</th></tr></thead><tbody>'+rows+'</tbody></table>'
    + '<div class="note think"><b>คิดต่อ:</b> '+m.reflect+'</div>'
    + '<div class="dock"><button class="btn ghost" data-act="again">ทำใหม่</button>'
    + '<button class="btn primary" data-act="next">ภารกิจถัดไป</button></div>';
}

/* ---------- ภารกิจ I2: ตรวจรับล็อต ---------- */
function qcRound(){ return I.m.rounds[I.ri]; }

function qcEvidence(){
  var r = qcRound(), o = pairFrom(r.order), a = pairFrom(r.actual), t = I.tests;
  var fmis = !!t.t1 && !sameAtoms(amideAtoms(a.acid, a.amine), amideAtoms(o.acid, o.amine));
  var pmis = !!t.t3 && !samePair(a, o);
  var conf = !!t.t3 && samePair(a, o);
  return { order:o, actual:a, formulaMismatch:fmis, productMismatch:pmis, confirmed:conf };
}

function testBtn(id, ico, name, sub){
  return '<button class="condbtn acid'+(I.tests[id] ? ' ran' : '')+'" data-act="iTest" data-id="'+id+'">'
    + '<span class="cico">'+ico+'</span><b>'+name+'</b><small>'+sub+'</small></button>';
}

function qcResultsHTML(){
  var r = qcRound(), o = pairFrom(r.order), a = pairFrom(r.actual), t = I.tests, h = '';
  if(t.t1){
    var fo = fmtFormula(amideAtoms(o.acid, o.amine)), fa = fmtFormula(amideAtoms(a.acid, a.amine));
    h += '<div class="qres"><b>ผลวิเคราะห์ธาตุ</b> สูตรโมเลกุลของตัวอย่าง = <b>'+fa+'</b> · ใบสั่ง = '+fo
       + ' → <span class="'+(fa === fo ? 'okc' : 'noc')+'">'+(fa === fo ? 'ตรงกัน' : 'ไม่ตรงกัน')+'</span></div>';
  }
  if(t.t2){
    h += '<div class="qres"><b>ผลตรวจหมู่ฟังก์ชัน</b> ตัวอย่างมีหมู่เอไมด์ (–CONH–) เหมือนสารที่สั่ง → <span class="okc">ตรงกัน</span></div>';
  }
  if(t.t3){
    h += '<div class="qres"><b>ผลไฮโดรลิซิสในภาวะกรด (H⁺, Δ)</b> ตัวอย่างให้ผลิตภัณฑ์ 2 ชนิด'
       + molRow([{ mol:molAcidPlain(a.acid), cap:a.acid.name }, { sym:'+' },
                 { mol:molAmmonium(a.amine), cap:a.amine.name+' (รูปเกลือแอมโมเนียม)' }])
       + '<div class="qcmp">ใบสั่งต้องได้ <b>'+o.acid.name+'</b> + <b>'+o.amine.name+'</b> → '
       + '<span class="'+(samePair(a, o) ? 'okc' : 'noc')+'">'+(samePair(a, o) ? 'ตรงกัน' : 'ไม่ตรงกัน')+'</span></div></div>';
  }
  return h;
}

function isoQcView(){
  var m = I.m, r = qcRound(), o = pairFrom(r.order);
  var dots = m.rounds.map(function(_, i){
    return '<span class="rdot'+(i < I.ri ? ' done' : (i === I.ri ? ' now' : ''))+'">'+(i+1)+'</span>';
  }).join('');
  var order = '<div class="qorder"><div class="benchlab">ใบสั่งซื้อล็อต '+(I.ri+1)+' / '+m.rounds.length+'</div>'
    + '<div class="bench small">'+renderMol(molAmide(o.acid, o.amine, {}), { maxw:230 })+'</div>'
    + '<div class="molcap"><b>'+amideName(o.acid, o.amine)+'</b> · '+fmtFormula(amideAtoms(o.acid, o.amine))+'</div></div>';

  var closed = '';
  if(I.closed){
    var a = pairFrom(r.actual);
    closed = '<div class="verdict ok"><div class="vbig">'+(I.closed.verdict === 'accept' ? 'รับล็อตนี้ถูกต้อง' : 'ส่งคืนล็อตนี้ถูกต้อง')+'</div>'
      + '<div>ตัวอย่างคือ <b>'+amideName(a.acid, a.amine)+'</b> ('+fmtFormula(amideAtoms(a.acid, a.amine))+')'
      + (samePair(a, o) ? ' ตรงตามใบสั่ง' : ' ไม่ตรงตามใบสั่ง')+'</div>'
      + (I.closed.note ? '<div class="vnote">'+I.closed.note+'</div>' : '')+'</div>'
      + '<div class="dock"><button class="btn primary" data-act="iNextRound">'
      + (I.ri + 1 < m.rounds.length ? 'ล็อตถัดไป' : 'สรุปผลการตรวจ')+'</button></div>';
  }

  var tests = '<div class="note">เลือก<b>วิธีตรวจ</b>ที่จำเป็น (ตรวจได้หลายวิธี) แล้วตัดสินใจเมื่อมีหลักฐานพอ</div>'
    + '<div class="condgrid">'
    + testBtn('t1', '⚖️', 'วิเคราะห์ธาตุ', 'หาสูตรโมเลกุล')
    + testBtn('t2', '🔬', 'ตรวจหมู่ฟังก์ชัน', 'ชนิดของหมู่')
    + testBtn('t3', '🔥', 'ไฮโดรลิซิส', 'H⁺, Δ ดูผลิตภัณฑ์')
    + '</div>';

  var verdict = I.closed ? '' :
      '<div class="dock"><button class="btn ghost" data-act="hint">คำใบ้</button>'
    + '<button class="btn aqua" data-act="iVerdict" data-id="reject">ส่งคืนล็อต</button>'
    + '<button class="btn primary" data-act="iVerdict" data-id="accept">รับล็อต</button></div>';

  return '<div class="rdots">'+dots+'</div>' + order + (I.closed ? '' : tests) + qcResultsHTML() + closed + verdict;
}

function isoQcDone(){

  }).join('');
  return '<div class="verdict ok"><div class="vbig">ตรวจครบทุกล็อต</div>'

    + '<div class="note think"><b>คิดต่อ:</b> '+m.reflect+'</div>'

    + '<button class="btn primary" data-act="next">กลับรายการภารกิจ</button></div>';
}

var TESTNAME = { t1:'วิเคราะห์ธาตุ', t2:'ตรวจหมู่ฟังก์ชัน', t3:'ไฮโดรลิซิส' };

function qcVerdict(v){
  var ev = qcEvidence(), r = qcRound(), msg = null, right = false, note = '';
  if(v === 'reject'){
    if(ev.formulaMismatch || ev.productMismatch){ right = true; }
    else if(ev.confirmed){ msg = 'หลักฐานชี้ว่าตัวอย่างตรงกับใบสั่ง (ไฮโดรลิซิสได้กรดและเอมีนตัวเดียวกัน) ยังไม่ควรส่งคืน'; }
    else { msg = 'ยังไม่มีหลักฐานว่าตัวอย่างไม่ตรงใบสั่ง การส่งคืนต้องมีหลักฐานรองรับก่อน ลองเลือกวิธีตรวจเพิ่ม'; }
  } else {
    if(ev.confirmed){ right = true; }
    else if(ev.formulaMismatch || ev.productMismatch){ msg = 'หลักฐานที่ได้ขัดกับใบสั่งแล้ว (สูตรหรือผลิตภัณฑ์ไฮโดรลิซิสไม่ตรง) รับล็อตนี้ไม่ได้'; }
    else { msg = 'สูตรโมเลกุลและหมู่ฟังก์ชันที่ตรงกันยังไม่พอ เพราะไอโซเมอร์ก็ผ่านการตรวจสองอย่างนี้ ต้องมีหลักฐานที่แยกโครงสร้างได้ก่อนจึงจะรับ'; }
  }
  if(!right){
    I.wrong++; I.rwrong++; sfxBad(); buzz([20, 40, 20]);
    toast('<b>ยังตัดสินไม่ได้</b><br>'+msg, 'bad');
    return;
  }
  if(v === 'reject' && ev.formulaMismatch && I.tests.t3){
    note = 'ข้อสังเกต: สูตรโมเลกุลไม่ตรงก็ตัดสินได้แล้ว ไม่จำเป็นต้องไฮโดรลิซิส';
  } else if(v === 'reject' && ev.productMismatch && !ev.formulaMismatch && I.tests.t1){
    note = 'สูตรโมเลกุลตรงกับใบสั่ง แต่ผลิตภัณฑ์ไฮโดรลิซิสต่างกัน จึงเป็นไอโซเมอร์ ไม่ใช่สารตัวเดียวกัน';
  } else if(v === 'accept'){
    note = 'ไฮโดรลิซิสให้กรดและเอมีนตัวเดียวกับใบสั่ง จึงยืนยันได้ว่าเป็นสารตัวเดียวกัน';
  }
  var used = ['t1','t2','t3'].filter(function(k){ return I.tests[k]; }).map(function(k){ return TESTNAME[k]; });
  I.rlog.push({ tests:used.length ? used : ['—'], verdict:v, wrong:I.rwrong });
  I.closed = { verdict:v, note:note };
  sfxGood();
  drawIso();
}

function isoFinish(){
  I.done = true;
  var detail = I.kind === 'hunt'
    ? { found: I.found.map(function(f){ return f.acid.id+'+'+f.amine.id; }) }
    : { rounds: I.rlog.map(function(l){ return { tests:l.tests, verdict:l.verdict, wrong:l.wrong }; }) };
  I._scored = saveMission('iso', I.m, I.wrong, I.hints, isoSec(), detail);
  sfxWin();
  drawIso();
}

function isoAct(act, id){
  if(act === 'iAcid'){ I.acid = acidById(id); I.last = null; sfxPop(); drawIso(); }
  else if(act === 'iAmine'){ I.amine = amineById(id); I.last = null; sfxPop(); drawIso(); }
  else if(act === 'iCheck'){
    if(!I.acid || !I.amine) return;
    var got = amideAtoms(I.acid, I.amine);
    var pair = { acid:I.acid, amine:I.amine };
    if(sameAtoms(got, I.m.formula)){
      var dup = I.found.some(function(f){ return samePair(f, pair); });
      if(dup){ I.last = { acid:I.acid, amine:I.amine, res:'dup' }; sfxPop(); }
      else {
        I.found.push(pair); I.last = { acid:I.acid, amine:I.amine, res:'ok' }; sfxGood();
        if(I.found.length === I.total){ isoFinish(); return; }
      }
    } else {
      I.wrong++; I.last = { acid:I.acid, amine:I.amine, res:'no' }; sfxBad(); buzz([20, 40, 20]);
    }
    drawIso();
  }
  else if(act === 'iTest'){ I.tests[id] = true; sfxPop(); drawIso(); }
  else if(act === 'iVerdict'){ qcVerdict(id); }
  else if(act === 'iNextRound'){
    if(I.ri + 1 < I.m.rounds.length){ I.ri++; I.tests = {}; I.rwrong = 0; I.closed = null; drawIso(); }
    else { isoFinish(); }
  }
  else if(act === 'hint'){
    if(!I._hinted){ I.hints = 1; I._hinted = true; }
    toast('<b>คำใบ้</b><br>'+I.m.hint);
  }
  else if(act === 'again'){ startIso(I.m); }
  else if(act === 'next'){
    var i = -1;
    for(var k = 0; k < ISO_MISSIONS.length; k++) if(ISO_MISSIONS[k].id === I.m.id) i = k;
    if(i >= 0 && i + 1 < ISO_MISSIONS.length) startIso(ISO_MISSIONS[i + 1]);
    else go('isoList');
  }
}

  var body='';

  else if(s==='synthList') body=missionListView('synth');
  else if(s==='hydroList') body=missionListView('hydro');
  else if(s==='isoList') body=missionListView('iso');
  else if(s==='sandbox') body=sandboxView();
  else if(s==='ref') body=refView();
  else if(s==='scores') body=scoreView();
