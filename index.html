  + '<div class="howto"><div class="hh">กติกาคะแนน</div>'
  + '<ul><li>ทำถูกตั้งแต่ครั้งแรก ได้ <b>10 คะแนน</b> ต่อภารกิจ</li>'
  + '<li>ทำผิด 1 ครั้ง หัก 2 คะแนน · เปิดคำใบ้ หัก 3 คะแนน (ต่ำสุด 3 คะแนน)</li>'
  + '<li>ทำซ้ำได้ ระบบเก็บคะแนนครั้งที่ดีที่สุด</li>'
  + '<li>ป้าย '+xtag()+' คือเนื้อหานอกกรอบคู่มือครู เคมี 5 ฝึกเพิ่มได้แต่ไม่ใช่เป้าหมายหลัก</li></ul></div>'
  + '</div>';
}

/* ---------- รายการภารกิจ ---------- */
function missionListView(kind){
  var list = kind==='synth' ? SYNTH_MISSIONS : (kind==='hydro' ? HYDRO_MISSIONS : ISO_MISSIONS);
  var cls = kind;
  var heads = {
    synth:{t:'ห้องเชื่อมพันธะ', d:'ทุกภารกิจเดินตามขั้นตอนจริง: ผสม → เกิดเกลือ → ให้ความร้อน → ขจัดน้ำ → ได้เอไมด์'},
    hydro:{t:'ห้องแยกสลาย', d:'ทุกภารกิจเดินตามขั้นตอนจริง: เลือกภาวะ → ให้ความร้อน → ตัดพันธะเอไมด์ → เติมชิ้นส่วนจากน้ำ'},
    iso:{t:'ห้องไอโซเมอร์', d:'สูตรโมเลกุลเดียวกัน โครงสร้างต่างกัน — วิเคราะห์ให้ครบ แล้วประเมินหลักฐานว่าเป็นสารตัวเดียวกันหรือไม่'}
  };
  var head = heads[kind];
  var act = kind==='synth' ? 'playS' : (kind==='hydro' ? 'playH' : 'playI');
  function card(m, a){
    var p=G.progress[m.id];
    var star = p&&p.done ? '<span class="star">'+p.score+'</span>' : '<span class="star off">–</span>';
    return '<button class="mcard '+cls+(p&&p.done?' done':'')+'" data-act="'+a+'" data-id="'+m.id+'">'
      + '<div class="mnum">'+m.id+'</div>'
      + '<div class="mbody"><div class="mt">'+m.title+'</div><div class="mtags">'+metaTags(m)+'</div>'
      + '<div class="mdsc">'+m.brief.replace(/<[^>]+>/g,'')+'</div></div>'
      + star + '</button>';
  }
  var cards = list.map(function(m){ return card(m, act); }).join('');
  var pre = '';
  if(kind==='iso'){
    pre = '<div class="secthead">ภารกิจเตรียม (อยู่ในห้องเชื่อมพันธะ)</div>'
        + SYNTH_MISSIONS.filter(function(m){ return m.iso; }).map(function(m){ return card(m,'playS'); }).join('')
        + '<div class="secthead">ภารกิจในห้องไอโซเมอร์</div>';
  }
  var legend = '<div class="legend">'+xtag()+' = เนื้อหานอกกรอบคู่มือครู เคมี 5 ฝึกเพิ่มได้ แต่ไม่ใช่เป้าหมายการเรียนรู้หลัก · '
             + '<span class="ltag analyze">วิเคราะห์</span> <span class="ltag evaluate">ประเมินค่า</span> = ระดับการคิดที่ภารกิจบังคับให้ใช้</div>';
  return '<div class="mlist"><div class="mlisthead '+cls+'"><h2>'+head.t+'</h2><p>'+head.d+'</p></div>'+pre+cards+legend+'</div>';
}

/* ---------- คะแนน ---------- */
function scoreView(){
  var rows='';
  var all = SYNTH_MISSIONS.map(function(m){return {m:m,k:'เชื่อม'};})
            .concat(HYDRO_MISSIONS.map(function(m){return {m:m,k:'ผ่า'};}))
            .concat(ISO_MISSIONS.map(function(m){return {m:m,k:'ไอโซเมอร์'};}));
  all.forEach(function(o){
    var p=G.progress[o.m.id];
    rows += '<tr class="'+(p&&p.done?'ok':'')+'"><td>'+o.m.id+'</td><td>'+o.m.title+'</td><td>'+o.k+'</td>'
      + '<td class="num">'+(p&&p.done?p.score:'–')+'</td>'
      + '<td class="num">'+(p&&p.done?p.wrong:'–')+'</td>'
      + '<td class="num">'+(p&&p.done?fmtTime(p.sec):'–')+'</td></tr>';
  });
  var pct=Math.round(totalScore()/maxScore()*100);
  return '<div class="scorepage">'
   + '<div class="bigscore"><div class="bs1">'+totalScore()+'</div><div class="bs2">จาก '+maxScore()+' คะแนน ('+pct+'%)</div>'
   + '<div class="bs3">ทำสำเร็จ '+doneCount()+' จาก '+(SYNTH_MISSIONS.length+HYDRO_MISSIONS.length+ISO_MISSIONS.length)+' ภารกิจ</div></div>'
   + '<table class="stab"><thead><tr><th>รหัส</th><th>ภารกิจ</th><th>โหมด</th><th>คะแนน</th><th>ผิด</th><th>เวลา</th></tr></thead>'
   + '<tbody>'+rows+'</tbody></table>'
   + '<div class="dock"><button class="btn primary" data-act="submit">ส่งคะแนนให้ครู</button></div>'
   + '<div class="note">ระบบส่งคะแนนอัตโนมัติทุกครั้งที่ทำภารกิจสำเร็จ ปุ่มนี้ใช้ส่งสรุปทั้งหมดอีกครั้งเมื่อทำเสร็จ</div>'
   + '</div>';
}

/* ---------- ตั้งค่า ---------- */
function settingsView(){
  return '<div class="lab">'
  + '<div class="mhead"><div class="mtitle">ตั้งค่า (สำหรับครู)</div>'
  + '<div class="mbrief">วาง URL ของ Google Apps Script Web App เพื่อให้เกมส่งคะแนนเข้า Google Sheets</div></div>'
  + '<div class="form">'
  + '<label>Google Apps Script Web App URL</label>'
  + '<input id="inGas" placeholder="https://script.google.com/macros/s/..../exec" value="'+esc(GAS_URL)+'">'
  + '<button class="btn primary" data-act="saveGas">บันทึกและทดสอบการเชื่อมต่อ</button>'
  + '<div class="note">สถานะ: <b id="gasStat">'+(GAS_URL?(G.online?'เชื่อมต่อแล้ว':'ยังไม่ได้ทดสอบ'):'ยังไม่ได้ตั้งค่า')+'</b></div>'
  + '</div>'
  + '<div class="note think"><b>หมายเหตุ:</b> ถ้าไม่ตั้งค่า เกมยังเล่นได้ตามปกติ คะแนนจะแสดงในหน้า “คะแนน” '
  + 'แต่จะไม่ถูกบันทึกลง Google Sheets และจะหายเมื่อปิดหน้าเว็บ</div>'
  + '<div class="dock"><button class="btn ghost" data-act="goto" data-id="home">กลับหน้าหลัก</button></div></div>';
}

/* ---------- ผูกเหตุการณ์ ---------- */
function onTap(e){
  var t=e.target;
  var hitEl = t.closest ? t.closest('[data-hit]') : null;
  if(hitEl){
    var hit=hitEl.getAttribute('data-hit');
    if(G.screen==='synth') synthHit(hit);
    else if(G.screen==='hydro') hydroHit(hit);
    return;
  }
  var actEl = t.closest ? t.closest('[data-act]') : null;
  if(!actEl) return;
  var act=actEl.getAttribute('data-act');
  var id=actEl.getAttribute('data-id');

  if(act==='goto'){ go(id); return; }
  if(act==='gotoSettings'){ G.screen='settings'; render(); return; }
  if(act==='login'){ doLogin(); return; }
  if(act==='saveGas'){
    GAS_URL = ($('inGas').value||'').trim();
    if(GAS_URL){
      sendToSheet('ping', {ts:new Date().toISOString(), by:G.student.sid||'-'});
      $('gasStat').textContent='กำลังทดสอบ...';
      setTimeout(function(){ var s=$('gasStat'); if(s) s.textContent = G.online?'เชื่อมต่อแล้ว':'ส่งไม่สำเร็จ (ตรวจการ Deploy ว่าเปิดเป็น Anyone)'; },1800);
      toast('บันทึก URL แล้ว');
    } else { toast('ล้างค่า URL แล้ว'); }
    return;
  }
  if(act==='playS'){ var m=null; SYNTH_MISSIONS.forEach(function(x){if(x.id===id)m=x;}); if(m) startSynth(m); return; }
  if(act==='playI'){ var q=null; ISO_MISSIONS.forEach(function(x){if(x.id===id)q=x;}); if(q) startIso(q); return; }
  if(act==='playH'){ var h=null; HYDRO_MISSIONS.forEach(function(x){if(x.id===id)h=x;}); if(h) startHydro(h); return; }
  if(act==='sbAcid'){ SB.acid=id; $('view').innerHTML=sandboxView(); return; }
  if(act==='sbAmine'){ SB.amine=id; $('view').innerHTML=sandboxView(); return; }
  if(act==='sbSynth'){ startSynth(null); S.acid=acidById(SB.acid); S.amine=amineById(SB.amine); drawSynth(); return; }
  if(act==='sbHydro'){ startHydro(null,{acid:acidById(SB.acid), amine:amineById(SB.amine)}); return; }
  if(act==='submit'){
    var sum=sendSummary();
    toast(GAS_URL ? 'ส่งสรุปคะแนน '+sum.total+' คะแนนแล้ว' : 'ยังไม่ได้ตั้งค่า Google Sheets จึงบันทึกเฉพาะในเครื่อง','bad');
    sfxWin();
    return;
  }
  if(G.screen==='synth'){ synthAct(act,id); return; }
  if(G.screen==='hydro'){ hydroAct(act,id); return; }
  if(G.screen==='iso'){ isoAct(act,id); return; }
}

function doLogin(){
  var n=($('inName').value||'').trim();
  var s=($('inSid').value||'').trim();
  var r=($('inRoom').value||'').trim();
  if(!n||!s){ toast('กรอกชื่อและเลขประจำตัวก่อนเข้าห้องปฏิบัติการ','bad'); return; }
  G.student={name:n, sid:s, room:r};
  G.sessionStart=Date.now();
  sendToSheet('login',{ts:new Date().toISOString(), sid:s, name:n, room:r});
  sfxGood();
  go('home');
}

/* ---------- เริ่มต้น ---------- */
function boot(){
  document.addEventListener('click', onTap, false);
  render();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>

</html>
